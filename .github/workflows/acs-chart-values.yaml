name: ACS chart values

# Renders the ACS chart's service-setup Job with a site's values and
# checks the serviceSetup.config.splitDrivers it receives. A site holds
# a protocol on the built-in drivers with `<PROTO>: hold`, which only
# works if Helm passes it through; a null does not survive Helm 4.0.
# Run on Helm 3 and 4, because they merge values differently.

on:
  pull_request:
    branches:
      - dev
      - main
      - 'feature/**'
    paths:
      - 'deploy/**'
      - 'acs-service-setup/lib/split-drivers.js'
      - '.github/workflows/acs-chart-values.yaml'

jobs:
  render:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        helm: ['v3.17.3', 'v4.0.0', 'v4.2.3']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ matrix.helm }}

      - name: Check what service-setup receives
        run: deploy/test/split-drivers-values.sh
