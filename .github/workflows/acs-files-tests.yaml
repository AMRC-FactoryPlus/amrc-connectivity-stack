name: Files service tests

# Runs acs-files' unit tests, which drive the v1 file API over a
# temporary directory with stub Auth and ConfigDB clients.

on:
  pull_request:
    branches:
      - dev
      - main
      - 'feature/**'
    paths:
      - 'acs-files/**'
      - 'lib/js-service-client/**'
      - 'lib/js-service-api/**'
      - 'lib/js-rx-client/**'
      - 'lib/js-rx-util/**'
      - '.github/workflows/acs-files-tests.yaml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Update npm
        run: npm install -g npm@11.6.0

      # The local libraries are file: dependencies, so each needs its
      # own dependencies installed. The GSSAPI library is optional and
      # not needed by the tests.
      - name: Install dependencies
        run: |
          for dir in lib/js-rx-util lib/js-rx-client lib/js-service-client lib/js-service-api acs-files; do
            (cd "$dir" && npm install --save=false --omit=optional --no-audit --no-fund)
          done

      - name: Run the tests
        working-directory: acs-files
        run: npm test
