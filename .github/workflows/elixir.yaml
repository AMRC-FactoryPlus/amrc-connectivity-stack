name: Elixir
# The Elixir projects aren't built by the Makefiles or deployed yet, so
# this is the only place their checks run. Tests tagged :acs_local need
# the local test cluster and are excluded by default.
on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'lib/ex-**'
      - 'lib/erl-**'
      - 'acs-ingest/**'
      # FPlus.Service is checked against the JS client's UUIDs.
      - 'lib/js-service-client/lib/uuids.js'
      - '.github/workflows/elixir.yaml'

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project:
          - lib/ex-sparkplug
          - lib/ex-service-client
          - acs-ingest
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    env:
      MIX_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: ${{ matrix.project }}/.tool-versions
          version-type: strict

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.project }}/deps
            ${{ matrix.project }}/_build
          key: ${{ runner.os }}-mix-${{ matrix.project }}-${{ hashFiles(format('{0}/mix.lock', matrix.project), format('{0}/.tool-versions', matrix.project)) }}

      - name: Fetch dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Lint
        run: mix credo

      - name: Test
        run: mix test
