name: JS edge driver library tests

# Runs the tests of lib/js-edge-driver, including the Edge Scout tests,
# which check every message against lib/edge-scout-schemas, and the
# reconnect test against mosquitto in Docker. js-lib.yaml publishes the
# package and runs no tests.

on:
  pull_request:
    branches:
      - dev
      - main
      - 'feature/**'
    paths:
      - 'lib/js-edge-driver/**'
      - 'lib/edge-scout-schemas/**'
      - '.github/workflows/js-edge-driver-tests.yaml'

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lib/js-edge-driver
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npx eslint lib

      - name: Pull mosquitto
        run: docker pull eclipse-mosquitto:2.0.20

      # SCOUT_MOSQUITTO makes the mosquitto test fail, not skip, if
      # Docker is missing.
      - name: Run the tests
        env:
          SCOUT_MOSQUITTO: '1'
        run: npm test
