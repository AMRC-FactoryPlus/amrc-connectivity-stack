server {
    listen 8080;

    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Shell page for driver-supplied configuration UIs.
    #
    # Driver UIs are third-party documents that arrive through ConfigDB, so
    # they are untrusted content running in the operator's browser. Two
    # separate mechanisms contain them:
    #
    #   1. The embedding iframe carries `sandbox="allow-scripts"` and
    #      deliberately not `allow-same-origin`, so the document gets an
    #      opaque origin and cannot touch the console, its storage or its
    #      session.
    #   2. This policy. `default-src 'none'` means the document cannot fetch,
    #      XHR, open a WebSocket, or load a subresource of any kind. Inline
    #      script and style are allowed, because a self-contained document is
    #      the entire point, but it has nowhere to send anything.
    #
    # This location exists only so the frame gets its own policy: an iframe
    # using `srcdoc` would inherit the console's policy below, which would
    # force the whole console to permit inline script.
    location = /driver-ui/host.html {
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # StreamSaver's helper, for streamed downloads (dataset CSVs, files).
    #
    # The console streams big downloads to disk with StreamSaver. In a
    # secure context StreamSaver loads mitm.html in a hidden iframe, and
    # that page registers sw.js as a service worker. The worker then
    # answers the download URLs, which sit under this path, with the data
    # the console writes. StreamSaver's default copy of these pages is on
    # GitHub Pages, which the console's frame-src 'self' blocks, so the
    # download never starts. The console serves its own copy instead,
    # from public/streamsaver/ (see src/lib/stream-download.js).
    #
    # This location exists so the helper gets its own policy. The
    # console's policy below says frame-ancestors 'none', which would stop
    # even a same-origin frame of mitm.html. Here only the console may
    # frame it. The page may run its own script file, fetch from this
    # origin and register the worker, and nothing else. mitm.html has no
    # inline script: its script is in mitm.js, so none is allowed. The
    # worker's scope is this directory, so it cannot see any of the
    # console's other requests.
    #
    # ^~ keeps any regex location from taking these files over, and
    # try_files never falls back to index.html: a download URL that no
    # worker answers is a plain 404. sw.js gets a JavaScript type from
    # mime.types, as a service worker script must.
    location ^~ /streamsaver/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The i3X Explorer, vendored from ace-technologies-inc/i3X-Explorer
    # (i3x-explorer/FORK.md) and built into this folder.
    #
    # The Explorer page shows it in a same-origin iframe, so that its
    # styles and the console's never meet, and lends it the console's
    # session through window.parent. The console's policy below says
    # frame-ancestors 'none', which would stop that frame, so this
    # location has its own policy: the console's, except that only the
    # console may frame it. connect-src is open for the same reason as
    # the console's: the i3X service URL is only known at run time.
    # worker-src 'self' is for its catalog worker. It has no inline
    # script and needs no fonts from outside.
    location ^~ /i3x-explorer/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src * data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri $uri/ /i3x-explorer/index.html;
    }

    location / {
        # The console's own policy. script-src carries no 'unsafe-inline',
        # which means it genuinely protects against script injection, and
        # keeping it that way costs a little care elsewhere.
        #
        # index.html must stay free of inline scripts. It had two. The
        # environment block now lives in public/env.js, loaded as an ordinary
        # same-origin file, because import-meta-env rewrites it when the
        # container starts and no build-time hash could ever cover content
        # that varies per deployment. Monaco's worker environment is now set
        # in src/main.js, inside the bundle, and a plugin in vite.config.js
        # strips the copy vite-plugin-monaco-editor-esm injects. That plugin
        # fails the build if the injection ever stops matching, so this
        # cannot rot silently.
        #
        # Adding an inline script anywhere in index.html will break the
        # console. Put it in a file under public/ instead.
        #
        # style-src still needs 'unsafe-inline': Vue's scoped styles and the
        # Font Awesome kit both inject style elements at runtime. Inline
        # style is a far smaller problem than inline script.
        #
        # kit.fontawesome.com serves the icon kit, which index.html loads
        # directly and which then pulls its CSS and fonts from sibling hosts
        # under the same domain. connect-src is open because the console's
        # service URLs are injected at deploy time and are not known at build
        # time. worker-src needs blob: for Monaco's editor workers.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.fontawesome.com; style-src 'self' 'unsafe-inline' https://*.fontawesome.com; img-src 'self' data: blob:; font-src 'self' data: https://*.fontawesome.com; connect-src * data: blob:; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;

        try_files $uri $uri/ /index.html;
    }
}
