#-REQUIRE: auth i3x
# i3x: the "Device data" composite below names i3X's ReadObject, and a
# dump load resets the memberships of every object it names, so this
# dump must load after i3x.yaml.
service: !u UUIDs.Service.ConfigDB
version: 2
objects:

  !u UUIDs.Class.Service:
    !u DataAccess.Service.DataAccess:
      name: "Data Access service"
  
  !u Auth.Class.ServiceRole:
    !u DataAccess.Requirement.ServiceRole:
      name: "Data Access service role"
      subclassOf:
        - !u Auth.Class.CentralService

  !u ConfigDB.Class.R3Class:
    !u DataAccess.Group.DatasetGroup:
      name: "Dataset group"
    !u DataAccess.Group.DatasetRoleGroup:
      name: "Dataset role"
      subclassOf:
        - !u DataAccess.Group.DatasetGroup
    !u DataAccess.Group.FunctionalDatasetGroup:
      name: "Functional dataset group"
      subclassOf:
        - !u DataAccess.Group.DatasetGroup
      
  !u DataAccess.Group.DatasetGroup:
    !u DataAccess.Class.Dataset:
      name: "Dataset"
  
  !u DataAccess.Group.FunctionalDatasetGroup:
    !u DataAccess.Class.Published:
      name: "Published dataset"
      subclassOf:
        - !u DataAccess.Class.Dataset
    !u DataAccess.Class.Partial:
      name: "Partial dataset"
      subclassOf:
        - !u DataAccess.Class.Dataset
    !u DataAccess.Class.MESDataset:
      name: "MES dataset"
      subclassOf:
        - !u DataAccess.Class.Dataset
    !u DataAccess.Class.Equipment:
      name: "MES equipment"
      subclassOf:
        - !u DataAccess.Class.MESDataset
    !u DataAccess.Class.WorkOrder:
      name: "MES work order"
      subclassOf:
        - !u DataAccess.Class.MESDataset
    !u DataAccess.Class.Product:
      name: "MES product"
      subclassOf:
        - !u DataAccess.Class.MESDataset
    !u DataAccess.Class.Operation:
      name: "MES operation"
      subclassOf:
        - !u DataAccess.Class.MESDataset
    !u DataAccess.Class.Run:
      name: "Run"
      subclassOf:
        - !u DataAccess.Class.MESDataset

# These are in core-apps for now, as they were previously R1 and are
# preventing the Application upgrade to R2. Once all installations are
# upgraded they can come back here.
#
#  !u MetaDB.Class.AppGroup: 
#    !u DataAccess.App.DatasetDefinition:
#      name: "Dataset definition"
#      subclassOf:
#        - !u UUIDs.Class.App
#    !u DataAccess.App.DatasetMetadata:
#      name: "Dataset metadata"
#      subclassOf:
#        - !u UUIDs.Class.App

  !u ConfigDB.Class.R1Class:
    !u DataAccess.Class.Measurement:
      name: "Measurement"
    !u DataAccess.Class.MES:
      name: "MES"

  !u DataAccess.App.DatasetDefinition:
    !u DataAccess.App.SparkplugSrc:
      name: "Sparkplug source"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry
    !u DataAccess.App.SparkplugSubset:
      name: "Sub-device"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry
    # The device kinds that read the UNS bucket, so a dataset holds
    # what i3X serves. New device datasets use these; Data Access no
    # longer creates the two above.
    !u DataAccess.App.UNSDevice:
      name: "UNS device"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry
    !u DataAccess.App.UNSDeviceMetrics:
      name: "UNS device metrics"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry
    !u DataAccess.App.UnionComponents:
      name: "Union components"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry
    !u DataAccess.App.SessionLimits:
      name: "Session limits"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry

  !u DataAccess.App.DatasetMetadata:
    !u DataAccess.App.MESIdentifiers:
      name: "MES identifiers"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry
    # The apps below hold metadata written by the Admin UI. They are
    # members of Dataset metadata so the service passes them through,
    # but they are deliberately not in the service's own constants: an
    # edit to an invalid dataset deletes the entries of every app listed
    # there, and these must survive that.
    !u DataAccess.App.Tags:
      name: "Dataset tags"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry
    !u DataAccess.App.EquipmentLabels:
      name: "Equipment device labels"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry
    !u DataAccess.App.RunMetadata:
      name: "Run metadata"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry
    !u DataAccess.App.Recording:
      name: "Recording in progress"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry

  !u UUIDs.Class.Special:
    !u DataAccess.Special.InvalidDataset:
      name: "Structurally invalid dataset"

  # Roles must be subclasses of Principal: Auth only treats subclasses
  # of Principal as groups, so a role without it grants nothing.
  !u Auth.Class.ClientRole:
    !u DataAccess.Group.DatasetMaker:
      name: "Dataset maker"
      subclassOf:
        - !u Auth.Class.Principal
    !u DataAccess.Group.DatasetManager:
      name: "Dataset manager"
      subclassOf:
        - !u Auth.Class.Principal

# Permissions
  !u Auth.Class.ServicePerms:
    !u DataAccess.Perm.All:
      name: "Data Access permission"
      subclassOf:
        - !u Auth.Class.Permission

  !u DataAccess.Perm.All:
    !u DataAccess.Perm.CreateDataset:
      name: "Create dataset"
    !u DataAccess.Perm.IncludeInUnion:
      name: "Include in union"
    !u DataAccess.Perm.ReadDataset:
      name: "Read dataset"
    !u DataAccess.Perm.UseForSession:
      name: "Use for session"
    !u DataAccess.Perm.EditDataset:
      name: "Edit dataset"
    !u DataAccess.Perm.DeleteDataset:
      name: "Delete dataset"
    # Data Access only: build datasets from a device. This was "Use
    # Sparkplug data"; it never gave MQTT access.
    !u DataAccess.Perm.UseDevice:
      name: "Build datasets from device"

  # Browse a device in i3X and build datasets from it. Each service
  # sees its own half. It must stay a subclass of Permission: Auth only
  # expands composites that are.
  !u Auth.Class.CompositePerm:
    !u ACS.Perm.Composite.DeviceData:
      name: "Device data"
      subclassOf:
        - !u UUIDs.Class.Permission
      enum:
        - !u I3X.Perm.ReadObject
        - !u DataAccess.Perm.UseDevice

      
---
service: !u UUIDs.Service.Authentication
version: 2
grants:
  !u DataAccess.Requirement.ServiceRole:
    !u UUIDs.Permission.Directory.AdvertiseService:
      !u DataAccess.Service.DataAccess: false
    !u UUIDs.Permission.Auth.ReadACL:
      !u DataAccess.Perm.All: true
    !u UUIDs.Permission.ConfigDB.ReadConfig:
      !u DataAccess.App.DatasetDefinition: true
      !u DataAccess.App.DatasetMetadata: true
      !u UUIDs.App.Info: false
      # Device originMap, to resolve sub-device metric references to
      # their current Sparkplug paths.
      !u UUIDs.App.DeviceInformation: false
      # A new UNS device dataset needs a device with a placement.
      !u DataAccess.External.ISA95Placement: false
    # Metadata writes go through Data Access, which checks EditDataset
    # on the dataset first: tags, labels and run details, and the name
    # of a dataset (never of another object).
    !u UUIDs.Permission.ConfigDB.WriteConfig:
      !u DataAccess.App.DatasetDefinition: true
      !u DataAccess.App.DatasetMetadata: true
      !u UUIDs.App.Info: false
    !u ConfigDB.Perm.CreateObject:
      !u DataAccess.Class.Dataset: false
    # A device's default dataset has a UUID worked out from the
    # device's, so Data Access names the UUID when it creates one.
    !u ConfigDB.Perm.CreateSpecificObject:
      !u DataAccess.Class.Dataset: false
    !u ConfigDB.Perm.ReadMembers:
      !u DataAccess.App.DatasetDefinition: false
      !u DataAccess.App.DatasetMetadata: false
      !u DataAccess.Class.Dataset: "both"
      !u DataAccess.Group.FunctionalDatasetGroup: "both"
      # A new UNS device dataset must name a device.
      !u UUIDs.Class.Device: false
    # Setting a dataset's kind moves it between the kind classes, the
    # members of Functional dataset group.
    !u ConfigDB.Perm.WriteMembers:
      !u DataAccess.Class.Dataset: true
      !u DataAccess.Group.FunctionalDatasetGroup: true
    !u ConfigDB.Perm.WriteMemberships:
      !u DataAccess.Class.Dataset: true
    !u ConfigDB.Perm.WriteSubclasses:
      !u DataAccess.Class.Dataset: true
    !u ConfigDB.Perm.WriteSuperclasses:
      !u DataAccess.Class.Dataset: true
    !u ConfigDB.Perm.ReadSubclasses:
      !u DataAccess.Class.Dataset: true
    !u ConfigDB.Perm.DeleteObject:
      !u DataAccess.Class.Dataset: true
    # Datasets are created owned by the caller: ConfigDB needs GiveTo
    # on the owner, and ReadKerberos resolves the caller's UUID.
    !u ConfigDB.Perm.GiveTo:
      !u Auth.Class.Principal: true
    !u Auth.Perm.ReadKerberos: null

  # Everything the Admin UI needs to make datasets and record runs as
  # the signed-in user. A member edits and deletes only the datasets
  # they created (Data Access records the creator as owner), and that
  # includes their names, tags, labels, kinds and run details, which
  # Data Access writes for them. Reading, unions and sessions still
  # cover every dataset.
  !u DataAccess.Group.DatasetMaker:
    !u DataAccess.Perm.CreateDataset:
      !u DataAccess.App.DatasetDefinition: true
    !u DataAccess.Perm.UseDevice:
      !u UUIDs.Class.Device: true
    # The builder picks devices and shows live values through i3X.
    # A direct grant, not the composite, so the role never loses it
    # while the dumps load.
    !u I3X.Perm.ReadObject:
      !u UUIDs.Class.Device: true
    !u DataAccess.Perm.ReadDataset:
      !u DataAccess.Class.Dataset: true
    !u DataAccess.Perm.IncludeInUnion:
      !u DataAccess.Class.Dataset: true
    !u DataAccess.Perm.UseForSession:
      !u DataAccess.Class.Dataset: true
    !u DataAccess.Perm.EditDataset:
      !u UUIDs.Special.Mine: true
    !u DataAccess.Perm.DeleteDataset:
      !u UUIDs.Special.Mine: true
    !u UUIDs.Permission.ConfigDB.ReadConfig:
      !u DataAccess.App.DatasetMetadata: true
      !u UUIDs.App.Info: false
      !u UUIDs.App.Registration: false
    # Share picks who to share with from the list of accounts. Auth
    # lists only the principals whose Kerberos name the caller may
    # read, and the Admin UI adds the members of the Principal class.
    # The Admin UI names them from Info and Registration (above), and
    # shows no accounts until it can read both.
    !u Auth.Perm.ReadKerberos:
      !u Auth.Class.Principal: true
    !u ConfigDB.Perm.ReadMembers:
      !u Auth.Class.Principal: false
    # The kiosk's recording lock sits on the equipment, and any operator
    # at the machine starts and stops it, so it stays a direct write.
    !u UUIDs.Permission.ConfigDB.WriteConfig:
      !u DataAccess.App.Recording: false

  # Dataset maker's grants, with edit and delete on every dataset. For
  # whoever tidies up other people's datasets, and the datasets made
  # before Data Access recorded owners.
  !u DataAccess.Group.DatasetManager:
    !u DataAccess.Perm.CreateDataset:
      !u DataAccess.App.DatasetDefinition: true
    !u DataAccess.Perm.UseDevice:
      !u UUIDs.Class.Device: true
    !u I3X.Perm.ReadObject:
      !u UUIDs.Class.Device: true
    !u DataAccess.Perm.ReadDataset:
      !u DataAccess.Class.Dataset: true
    !u DataAccess.Perm.IncludeInUnion:
      !u DataAccess.Class.Dataset: true
    !u DataAccess.Perm.UseForSession:
      !u DataAccess.Class.Dataset: true
    !u DataAccess.Perm.EditDataset:
      !u DataAccess.Class.Dataset: true
    !u DataAccess.Perm.DeleteDataset:
      !u DataAccess.Class.Dataset: true
    !u UUIDs.Permission.ConfigDB.ReadConfig:
      !u DataAccess.App.DatasetMetadata: true
      !u UUIDs.App.Info: false
      !u UUIDs.App.Registration: false
    # Share lists accounts; as for Dataset maker.
    !u Auth.Perm.ReadKerberos:
      !u Auth.Class.Principal: true
    !u ConfigDB.Perm.ReadMembers:
      !u Auth.Class.Principal: false
    # The kiosk's recording lock sits on the equipment, and any operator
    # at the machine starts and stops it, so it stays a direct write.
    !u UUIDs.Permission.ConfigDB.WriteConfig:
      !u DataAccess.App.Recording: false


