#-REQUIRE: auth
service: !u UUIDs.Service.ConfigDB
version: 2
objects:

  !u UUIDs.Class.Service:
    !u DataAccess.Service.DataAccess:
      name: "Data Access service"
  
  !u Auth.Class.ServiceRole:
    !u DataAccess.Requirement.ServiceRole:
      name: "Data Access service role"
      subclassOf:
        - !u Auth.Class.CentralService

  !u ConfigDB.Class.R3Class:
    !u DataAccess.Group.DatasetGroup:
      name: "Dataset group"
    !u DataAccess.Group.DatasetRoleGroup:
      name: "Dataset role"
      subclassOf:
        - !u DataAccess.Group.DatasetGroup
    !u DataAccess.Group.FunctionalDatasetGroup:
      name: "Functional dataset group"
      subclassOf:
        - !u DataAccess.Group.DatasetGroup
      
  !u DataAccess.Group.DatasetGroup:
    !u DataAccess.Class.Dataset:
      name: "Dataset"
  
  !u DataAccess.Group.FunctionalDatasetGroup:
    !u DataAccess.Class.Published:
      name: "Published dataset"
      subclassOf:
        - !u DataAccess.Class.Dataset
    !u DataAccess.Class.Partial:
      name: "Partial dataset"
      subclassOf:
        - !u DataAccess.Class.Dataset
    !u DataAccess.Class.MESDataset:
      name: "MES dataset"
      subclassOf:
        - !u DataAccess.Class.Dataset
    !u DataAccess.Class.Equipment:
      name: "MES equipment"
      subclassOf:
        - !u DataAccess.Class.MESDataset
    !u DataAccess.Class.WorkOrder:
      name: "MES work order"
      subclassOf:
        - !u DataAccess.Class.MESDataset
    !u DataAccess.Class.Product:
      name: "MES product"
      subclassOf:
        - !u DataAccess.Class.MESDataset
    !u DataAccess.Class.Operation:
      name: "MES operation"
      subclassOf:
        - !u DataAccess.Class.MESDataset
    !u DataAccess.Class.Run:
      name: "Run"
      subclassOf:
        - !u DataAccess.Class.MESDataset

# These are in core-apps for now, as they were previously R1 and are
# preventing the Application upgrade to R2. Once all installations are
# upgraded they can come back here.
#
#  !u MetaDB.Class.AppGroup: 
#    !u DataAccess.App.DatasetDefinition:
#      name: "Dataset definition"
#      subclassOf:
#        - !u UUIDs.Class.App
#    !u DataAccess.App.DatasetMetadata:
#      name: "Dataset metadata"
#      subclassOf:
#        - !u UUIDs.Class.App

  !u ConfigDB.Class.R1Class:
    !u DataAccess.Class.Measurement:
      name: "Measurement"
    !u DataAccess.Class.MES:
      name: "MES"

  !u DataAccess.App.DatasetDefinition:
    !u DataAccess.App.SparkplugSrc:
      name: "Sparkplug source"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry
    !u DataAccess.App.SparkplugSubset:
      name: "Sub-device"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry
    !u DataAccess.App.UnionComponents:
      name: "Union components"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry
    !u DataAccess.App.SessionLimits:
      name: "Session limits"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry

  !u DataAccess.App.DatasetMetadata:
    !u DataAccess.App.MESIdentifiers:
      name: "MES identifiers"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry
    # The apps below hold metadata written by the Admin UI. They are
    # members of Dataset metadata so the service passes them through,
    # but they are deliberately not in the service's own constants: an
    # edit to an invalid dataset deletes the entries of every app listed
    # there, and these must survive that.
    !u DataAccess.App.Tags:
      name: "Dataset tags"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry
    !u DataAccess.App.EquipmentLabels:
      name: "Equipment device labels"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry
    !u DataAccess.App.RunMetadata:
      name: "Run metadata"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry
    !u DataAccess.App.Recording:
      name: "Recording in progress"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry
    # The terms a Published dataset is released under, which travel in
    # its briefcase.
    !u DataAccess.App.ReleasePolicy:
      name: "Release policy"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry

  !u UUIDs.Class.Special:
    !u DataAccess.Special.InvalidDataset:
      name: "Structurally invalid dataset"

  !u Auth.Class.ClientRole:
    !u DataAccess.Group.DatasetMaker:
      name: "Dataset maker"

# Permissions
  !u Auth.Class.ServicePerms:
    !u DataAccess.Perm.All:
      name: "Data Access permission"
      subclassOf:
        - !u Auth.Class.Permission

  !u DataAccess.Perm.All:
    !u DataAccess.Perm.CreateDataset:
      name: "Create dataset"
    !u DataAccess.Perm.IncludeInUnion:
      name: "Include in union"
    !u DataAccess.Perm.ReadDataset:
      name: "Read dataset"
    !u DataAccess.Perm.UseForSession:
      name: "Use for session"
    !u DataAccess.Perm.EditDataset:
      name: "Edit dataset"
    !u DataAccess.Perm.DeleteDataset:
      name: "Delete dataset"
    !u DataAccess.Perm.UseSparkplug:
      name: "Use Sparkplug data"

configs:
  !u UUIDs.App.ConfigSchema:
    !u DataAccess.App.ReleasePolicy:
      title: Release policy
      description: >
        The terms a dataset is released under. Whoever adds the dataset
        to the Published class is accountable for them. The policy is
        copied into every briefcase built from the dataset.
      type: object
      required: [tier, data_owner, terms, permitted_use]
      additionalProperties: false
      properties:
        tier:
          description: >
            Who may have the data. `open`: anyone. `registered`: any
            signed-in user who has accepted the licence.
            `approved-project`: members of a project approved for this
            briefcase. `enclave-only`: approved projects, inside an
            enclave only.
          enum: [open, registered, approved-project, enclave-only]
        data_owner:
          description: >
            The organisation that owns the data, and who to contact
            about it. This is never a Factory+ principal.
          type: object
          required: [organisation, contact]
          additionalProperties: false
          properties:
            organisation:
              type: string
              minLength: 1
            contact:
              type: object
              required: [name, email]
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                email:
                  type: string
                  format: email
        terms:
          description: >
            Either a licence, as an SPDX identifier such as `CC-BY-4.0`,
            or a reference to the data sharing agreement.
          type: object
          minProperties: 1
          maxProperties: 1
          additionalProperties: false
          properties:
            licence:
              type: string
              minLength: 1
            agreement:
              type: string
              minLength: 1
        trial:
          description: A reference to the trial the data comes from.
          type: string
          minLength: 1
        permitted_use:
          description: >
            One paragraph saying what the data may be used for, shown
            to everyone who gets it.
          type: string
          minLength: 1
        embargo_until:
          description: Nobody outside Factory+ gets the data before this date.
          type: string
          format: date
        review_by:
          description: >
            The data owner reviews the release by this date, and renews
            or withdraws it.
          type: string
          format: date

---
service: !u UUIDs.Service.Authentication
version: 2
grants:
  !u DataAccess.Requirement.ServiceRole:
    !u UUIDs.Permission.Directory.AdvertiseService:
      !u DataAccess.Service.DataAccess: false
    !u UUIDs.Permission.Auth.ReadACL:
      !u DataAccess.Perm.All: true
    !u UUIDs.Permission.ConfigDB.ReadConfig:
      !u DataAccess.App.DatasetDefinition: true
      !u DataAccess.App.DatasetMetadata: true
      !u UUIDs.App.Info: false
      # Device originMap, to resolve sub-device metric references to
      # their current Sparkplug paths.
      !u UUIDs.App.DeviceInformation: false
    !u UUIDs.Permission.ConfigDB.WriteConfig:
      !u DataAccess.App.DatasetDefinition: true
    !u ConfigDB.Perm.CreateObject:
      !u DataAccess.Class.Dataset: false
    !u ConfigDB.Perm.ReadMembers:
      !u DataAccess.App.DatasetDefinition: false
      !u DataAccess.App.DatasetMetadata: false
      !u DataAccess.Class.Dataset: "both"
      !u DataAccess.Group.FunctionalDatasetGroup: "both"
    !u ConfigDB.Perm.WriteMembers:
      !u DataAccess.Class.Dataset: true
    !u ConfigDB.Perm.WriteMemberships:
      !u DataAccess.Class.Dataset: true
    !u ConfigDB.Perm.WriteSubclasses:
      !u DataAccess.Class.Dataset: true
    !u ConfigDB.Perm.WriteSuperclasses:
      !u DataAccess.Class.Dataset: true
    !u ConfigDB.Perm.ReadSubclasses:
      !u DataAccess.Class.Dataset: true
    !u ConfigDB.Perm.DeleteObject:
      !u DataAccess.Class.Dataset: true

  # Everything the Admin UI needs to make datasets and record runs as
  # the signed-in user. It is broad, and applies to every dataset, not
  # only a member's own: a member can edit any dataset's definition,
  # overwrite any dataset's tags, run details and recordings, set any
  # dataset's kind, read data from any device, and (through Info write)
  # rename any object. It does not include deleting datasets.
  !u DataAccess.Group.DatasetMaker:
    !u DataAccess.Perm.CreateDataset:
      !u DataAccess.App.DatasetDefinition: true
    !u DataAccess.Perm.UseSparkplug:
      !u UUIDs.Class.Device: true
    !u DataAccess.Perm.ReadDataset:
      !u DataAccess.Class.Dataset: true
    !u DataAccess.Perm.IncludeInUnion:
      !u DataAccess.Class.Dataset: true
    !u DataAccess.Perm.UseForSession:
      !u DataAccess.Class.Dataset: true
    !u DataAccess.Perm.EditDataset:
      !u DataAccess.Class.Dataset: true
    !u UUIDs.Permission.ConfigDB.ReadConfig:
      !u DataAccess.App.DatasetMetadata: true
      !u UUIDs.App.Info: false
    !u UUIDs.Permission.ConfigDB.WriteConfig:
      !u DataAccess.App.DatasetMetadata: true
      !u UUIDs.App.Info: false
    # Setting a kind adds the dataset to a class: ConfigDB checks the
    # class (WriteMembers) and the dataset (WriteMemberships).
    !u ConfigDB.Perm.WriteMembers:
      !u DataAccess.Group.FunctionalDatasetGroup: true
    !u ConfigDB.Perm.WriteMemberships:
      !u DataAccess.Class.Dataset: true


