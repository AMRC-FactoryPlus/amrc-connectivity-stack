# Simulator edge driver (edge-sim): cassette playback for demos and
# testing. Registers the driver with the Manager, the Cassette storage
# class and Application, and the cmdesc command definition for the
# player transport. No principals are bound to ControlPlayer here;
# that happens per deployment.
#
# NOTE: this dump deliberately contains NO Authentication grants. The
# auth dump loader REPLACES a principal's entire grant set with the
# dump's contents (dump_load_aces deletes what the dump omits), so
# only ONE dump may ever grant to a given principal. The Edge Agent
# role's grants (including ConfigDB read on the Cassette app, needed
# for the cassette proxy) live in helm.yaml with the rest of that
# role's grants.
#-REQUIRE: acs-v2 edge
---
service: !u UUIDs.Service.ConfigDB
version: 2
objects:
  !u ConfigDB.Class.R1Class:
    !u EdgeSim.Class.Cassette:
      name: "Cassette"

  !u UUIDs.Class.App:
    !u EdgeSim.App.Cassette:
      name: "Cassette recording"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry

  !u Edge.Class.Driver:
    !u ACS.Driver.Sim: { name: "Simulator" }

  !u ACS.PermGroup.CmdEsc:
    !u EdgeSim.Perm.ControlPlayer: { name: "Control simulator player" }

configs:
  !u Edge.App.DriverDef:
    !u ACS.Driver.Sim:
      image:
        repository: edge-sim
      polled: false
      presentation:
        address:
          title: "Channel or control address"
          description: "A cassette channel path (the tag path from the
            recording, e.g. Axes/X/Base_Axis/Load), or one of the
            player addresses: player:load, player:eject, player:play,
            player:pause, player:stop, player:seek, player:rate for
            transport control (writable), and player:status,
            player:cassette, player:position, player:rate_actual,
            player:error for state (read-only)."
          icon: "circle-play"
          placeholder: "e.g. Axes/X/Base_Axis/Load or player:play"
        path:
          title: "JSON Path"
          description: "JSONPath into the driver's payload. The driver
            publishes { value, timestamp }, so this is normally
            $.value."
          icon: "code"
          placeholder: "$.value"

  # Command Escalation definition for the player transport. Metric
  # names match the Player_Controls schema as mounted in a device
  # schema (folder name + metric name); the addresses these map to are
  # the player:* controls above.
  !u CmdEsc.App.CmdDef:
    !u EdgeSim.Perm.ControlPlayer:
      - name: Player_Controls/Load
        type: String
      - name: Player_Controls/Eject
        type: Boolean
      - name: Player_Controls/Play
        type: String
      - name: Player_Controls/Pause
        type: Boolean
      - name: Player_Controls/Stop
        type: Boolean
      - name: Player_Controls/Seek
        type: String
      - name: Player_Controls/Rate
        type: String
