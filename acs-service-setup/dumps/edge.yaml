#-REQUIRE: auth sparkplug acs-v2 files
---
service: !u UUIDs.Service.ConfigDB
version: 2
objects:
  !u ConfigDB.Class.R2Class:
    !u Edge.Group.EdgeGroup:
      name: "Edge-managed group"
      subclassOf:
        - !u Auth.Class.EdgeRole

  !u ConfigDB.Class.R1Class:
    !u Edge.Class.Connection:
      name: "Edge Agent connection"
    # XXX I'm not certain a Driver shouldn't be a class of connections?
    !u Edge.Class.Driver:
      name: "Edge Agent driver"
    # Edge Scout snapshots. The Edge Agent creates one File object of
    # this class per scan and uploads the snapshot to the Files
    # service. Its grants in helm.yaml are limited to this class.
    !u Edge.Class.ScoutResult:
      name: "Edge scout result"
      memberOf:
        - !u Files.Class.FileGroup
      subclassOf:
        - !u Files.Class.File

  # Not currently used. This would be difficult to implement with the
  # current implementation of composite perms as classes; we don't
  # support multi-rank classes yet.
  !u Auth.Class.PermissionGroup:
    !u Edge.Group.EdgePermission:
      name: "Edge-managed permissions"
      subclassOf:
        - !u Auth.Class.Permission

  !u Auth.Class.ServiceRole:
    !u ACS.Group.CentralMonitor:
      name: "Central monitor"
      subclassOf:
        - !u Auth.Class.CentralService
        - !u ACS.Group.SparkplugNode
        - !u ACS.Group.SparkplugReader

  !u UUIDs.Class.App:
    !u Edge.App.ClusterStatus:
      name: "Edge cluster status"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry
    !u Edge.App.ConnConfig:
      name: "Connection config"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry
    !u Edge.App.Deployment:
      name: "Edge deployment"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry
    !u Edge.App.DriverDef:
      name: "Driver definition"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry
    # Edge Scout: the scan status of a connection, keyed by the
    # connection UUID and written only by the Edge Agent.
    !u Edge.App.ScoutStatus:
      name: "Edge scout status"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry
    # Edge Scout: the live values of a connection's addresses, keyed by
    # the connection UUID and written only by the Edge Agent while the
    # Addresses panel holds a lease.
    !u Edge.App.ScoutValues:
      name: "Edge scout values"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry

  # Edge Scout: permission to send Node Control/Scout. Administrators
  # hold the whole CmdEsc group, so they can scan.
  !u ACS.PermGroup.CmdEsc:
    !u Edge.Perm.Scout: { name: "Scan device addresses" }

  !u Edge.Class.Driver:
    !u ACS.Driver.Bacnet:           { name: "Bacnet" }
    !u ACS.Driver.Modbus:           { name: "Modbus" }
    !u ACS.Driver.Test:             { name: "Test" }
    !u ACS.Driver.TestRust:         { name: "Test (Rust)" }
    !u ACS.Driver.TPlinkSmartPlug:  { name: "TP-Link smart plug" }
    !u ACS.Driver.External:         { name: "External driver" }
    !u ACS.Driver.ADS:              { name: "ADS" }
    !u ACS.Driver.RTDE:             { name: "RTDE" }
    !u ACS.Driver.Pathfindr:        { name: "Pathfindr" }
    !u ACS.Driver.RESTSplit:        { name: "REST" }
    !u ACS.Driver.MQTTSplit:        { name: "MQTT" }
    !u ACS.Driver.OPCUASplit:       { name: "OPC-UA" }
    !u ACS.Driver.UDPSplit:         { name: "UDP" }
    !u ACS.Driver.Focas:            { name: "FANUC FOCAS" }

configs:
  # Driver Definition Configuration
  # UI customization is done through the 'presentation' key with the following structure:
  #
  # presentation:
  #   address:                    # Configuration for the address field
  #     title: "Device Address"   # Title for the address field
  #     description: "..."        # Help text for the address field
  #     icon: "microchip"        # Font Awesome icon name (without the fa- prefix)
  #     placeholder: "..."       # Placeholder text for the address input
  #   path:                       # Configuration for the path field
  #     title: "Metric Path"     # Title for the path field
  #     description: "..."        # Help text for the path field
  #     icon: "code"             # Font Awesome icon name (without the fa- prefix)
  #     placeholder: "..."       # Placeholder text for the path input
  #     hidden: false             # Set to true to hide the path field (defaults to false)
  #
  # Example for a new driver:
  # !u ACS.Driver.NewDriver:
  #   polled: true
  #   presentation:
  #     address:
  #       title: "Device ID"
  #       description: "The device identifier"
  #       icon: "microchip"
  #       placeholder: "e.g. device123"
  #     path:
  #       title: "Parameter"
  #       description: "The parameter to access"
  #       icon: "code"
  #       placeholder: "e.g. temperature"
  #       hidden: false
  #
  # Edge Scout is set by the 'scout' key. A driver with no 'scout' key
  # shows the Addresses panel, and the driver's hello says whether it
  # can scan. This covers external drivers and drivers outside this
  # repo. 'scout: false' hides the panel.
  #
  # scout:
  #   title: "Scan the server's address space"   # Text on the panel
  #   address_form: opcua    # How the UI compares a metric's address
  #                          # with a scanned one: opcua, mqtt or exact
  #                          # (the default)
  #   options:               # JSON Schema for the scan options form,
  #     type: object         # passed to the driver as they are
  #     properties:
  #       root: { type: string }
  #   share_samples: false   # Let a custom driver UI see item samples
  !u Edge.App.DriverDef:
    !u ACS.Driver.Bacnet:
      polled: true
      presentation:
        address:
          title: "Device ID"
          description: "The Bacnet device identifier (numeric ID of the device)"
          icon: "building"
          placeholder: "e.g. 1234"
        path:
          title: "Object ID"
          description: "The Bacnet object identifier (format: object-type:instance-number, e.g. analog-value:1)"
          icon: "cube"
          placeholder: "e.g. analog-value:1"
      image:
        repository: edge-bacnet
      schema:
        properties:
          host:
            minLength: 1
            title: Hostname/IP
            type: string
            options:
              order: 1
        required:
          - host
        title: Bacnet Connection Details
        type: object
    !u ACS.Driver.Modbus:
      polled: true
      presentation:
        address:
          title: "Modbus Address"
          description: "Format: id,type,address,length (e.g. 1,holding,0,1) where id=device ID, type=register type (holding, input, coil, discrete), address=register address, length=number of registers"
          icon: "server"
          placeholder: "e.g. 1,holding,0,1"
        path:
          title: "Path"
          description: "Set this to 0"
          placeholder: "e.g. 0 (must be set to 0)"
      image:
        repository: edge-modbus
      schema:
        properties:
          host:
            minLength: 1
            title: Hostname/IP
            type: string
            options:
              order: 1
          port:
            default: 502
            title: Port
            type: number
            options:
              order: 2
          protocol:
            default: tcp
            enum:
              - tcp
            minLength: 1
            title: Protocol
            type: string
            options:
              order: 3
        required:
          - host
        title: Modbus Connection Details
        type: object
    !u ACS.Driver.Focas:
      polled: true
      presentation:
        address:
          title: "FOCAS Read"
          description: "What to read: sysinfo, status, alarm, program, speeds, position, macro:<n>, param:<n> (no axis), param:<n>:all or param:<n>:<axis>, or pmc:<area><n>[:byte|word|long] (e.g. pmc:D100:word). Every read answers with JSON, so set the payload format to JSON."
          icon: "gears"
          placeholder: "e.g. position"
        path:
          title: "JSON Path"
          description: "Where the value sits in the JSON the read answers with, e.g. $.absolute[0] for the first axis of a position read, or $.value for a macro variable"
          icon: "code"
          placeholder: "e.g. $.absolute[0]"
      image:
        repository: edge-focas
      schema:
        properties:
          host:
            minLength: 1
            title: Hostname/IP
            type: string
            options:
              order: 1
          port:
            default: 8193
            title: Port
            type: number
            options:
              order: 2
          timeout:
            default: 5000
            title: Timeout (ms)
            type: number
            options:
              order: 3
        required:
          - host
        title: FANUC FOCAS Connection Details
        type: object
    !u ACS.Driver.Test:
      polled: true
      presentation: &test_presentation
        address:
          title: "Test Address"
          description: "Format: function:period:amplitude:packing (e.g. sin:3000:50:bd)"
          icon: "wave-square"
          placeholder: "e.g. sin:3000:50:bd"
        path:
          title: "Path"
          description: "Set this to 0"
          placeholder: "e.g. 0 (must be set to 0)"
      scout: &test_scout
        title: "List the test addresses"
        address_form: exact
        # A made-up tree of addresses, for testing the scan itself.
        options:
          type: object
          properties:
            size:
              title: "Items"
              description: "How many value items to list"
              type: integer
              minimum: 0
              default: 100
            depth:
              title: "Depth"
              description: "How many folder levels to list them in"
              type: integer
              minimum: 0
              default: 2
            fail:
              title: "Fail with"
              description: "End the scan with this error code instead of a result"
              type: string
            hang:
              title: "Hang"
              description: "Stop sending without ending the scan"
              type: boolean
              default: false
            delay_ms:
              title: "Delay (ms)"
              description: "Wait this long between batches"
              type: integer
              minimum: 0
              default: 0
            duplicates:
              title: "Duplicates"
              description: "Send some items twice"
              type: boolean
              default: false
        share_samples: false
      image:
        repository: edge-test
      schema: &test_schema
        properties: null
        title: Test Connection Details
        type: object
    # The Rust port of the Test driver, with the same addresses and
    # output. Hidden from the new-connection form until its image is
    # published and it has run beside the JS one on a dev cluster.
    !u ACS.Driver.TestRust:
      hidden: true
      polled: true
      presentation: *test_presentation
      scout: *test_scout
      image:
        repository: edge-test-rs
      schema: *test_schema
    !u ACS.Driver.TPlinkSmartPlug:
      polled: true
      presentation:
        address:
          title: "Command"
          description: "The command to read from the smart plug (SysInfo, PowerState, InUse, or Meter)"
          icon: "plug"
          placeholder: "e.g. PowerState"
        path:
          hidden: true
      image:
        repository: edge-tplink-smartplug
      schema:
        properties:
          host:
            minLength: 1
            title: Hostname/IP
            type: string
            options:
              order: 1
          timeout:
            title: Connection Timeout (ms)
            type: number
            default: 5000
            options:
              order: 2
        required:
          - host
        title: TP-Link Smart Plug Details
        type: object
    !u ACS.Driver.ADS:
      image:
        repository: edge-ads
      polled: false
      presentation:
        address:
          description: "The TwinCAT symbol name with optional cycle time (format:
            symbol_name[,cycle_time_ms])"
          icon: microchip
          placeholder: e.g. Global_IO.iAnalogue,500
          title: Symbol Name
        path:
          description: Must be set to $
          icon: code
          placeholder: Must be set to $
          title: Path
      schema:
        properties:
          localAdsPort:
            description: Local ADS port (auto-assigned if not specified)
            options:
              order: 6
            title: Local ADS Port (Optional)
            type: number
          localAmsNetId:
            description: Local AMS NetId (auto-assigned if not specified)
            options:
              order: 5
            title: Local AMS NetId (Optional)
            type: string
          routerAddress:
            description: IP address of the ADS router (usually the PLC)
            minLength: 1
            options:
              order: 2
            title: Router Address
            type: string
          routerTcpPort:
            default: 48898
            description: TCP port of the ADS router
            options:
              order: 4
            title: Router TCP Port
            type: number
          targetAdsPort:
            default: 851
            description: ADS port of the target (851 for TwinCAT runtime)
            options:
              order: 3
            title: Target ADS Port
            type: number
          targetAmsNetId:
            description: AMS NetId of the target PLC (e.g. 172.16.48.37.1.1)
            minLength: 1
            options:
              order: 1
            title: Target AMS NetId
            type: string
          timeoutDelay:
            default: 5000
            description: Connection timeout in milliseconds
            options:
              order: 7
            title: Timeout Delay (ms)
            type: number
        required:
          - targetAmsNetId
          - routerAddress
        title: ADS Connection Details
        type: object

    !u ACS.Driver.RTDE:
      image:
        repository: edge-rtde
      polled: false
      presentation:
        address:
          description: "The Metric Address to subscribe to. Available addresses: json/state (complete robot state), json/jointData (joint positions/velocities/currents), json/cartesianInfo (TCP position/orientation), json/robotModeData (robot mode/speeds/emergency stop), json/toolData (tool I/O/voltage/current), json/masterboardData (master board I/O/safety mode), json/forceModeFrame (force mode data), json/additionalInfo (freedrive button status), json/toolCommunicationInfo (tool communication settings)"
          icon: "exchange-alt"
          placeholder: "e.g. json/jointData"
          title: "Metric Address"
        path:
          description: "JSONPath notation to extract specific values from the message payload. Examples: $[0].positionActual (joint 0 position), $.toolVectorX (TCP X position), $.robotMode (robot mode), $.toolVoltage48V (tool voltage), $.freedriveButtonPressed (freedrive button status)"
          icon: "code"
          placeholder: "e.g. $[0].positionActual"
          title: "JSON Path"
      schema:
        properties:
          host:
            minLength: 1
            options:
              order: 1
            title: "Hostname/IP"
            type: string
          port:
            default: 30001
            description: "RTDE interface port. Common ports: 30001 (RTDE configuration/setup), 30002 (Dashboard server), 30003 (Primary/Secondary interface), 30004 (RTDE data exchange - most common for real-time streaming)"
            minLength: 1
            options:
              order: 2
            title: "Port"
            type: number
        required:
          - host
          - port
        title: "RTDE Connection Details"
        type: object

    !u ACS.Driver.Pathfindr:
      image:
        repository: edge-pathfindr
      polled: true
      presentation:
        address:
          title: "Pathfindr Address"
          description: "What to read, as <data>/<serial>. Examples:
            location/SN12345, enviro/SN12345, runtime/SN12345,
            attrs/SN12345, buildings/55/cells. The driver's own interface
            builds these for you."
          icon: "location-dot"
          placeholder: "e.g. location/SN12345"
        path:
          title: "JSON Path"
          description: "JSONPath into the response, e.g.
            $.location.building or $.latest_temperature"
          icon: "code"
          placeholder: "e.g. $.location.building"
      # Rendered by the Manager in place of the per-metric fields. Generated
      # from edge-pathfindr/ui/metric-panel.html by
      # edge-pathfindr/tools/inline-ui.js; edit that file, not this one.
      # edge-pathfindr/test/ui-sync.test.js fails if the two diverge.
      ui:
        version: 1
        # BEGIN metric-panel.html
        document: |
          <!doctype html>
          <!-- ACS Pathfindr driver: per-metric configuration panel.
               Copyright 2026 University of Sheffield AMRC

               This document is embedded in the driver definition and rendered by the
               ACS Manager in a sandboxed frame. It has no network access by design
               (see acs-admin/.docker/nginx.conf), so it describes the Pathfindr API
               rather than a particular tenant: the operator reads their asset serial
               off the beacon or the portal and types it here.

               Keep this in sync with the copy in acs-service-setup/dumps/edge.yaml.
               test/ui-sync.test.js fails if they diverge. -->
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>Pathfindr metric</title>
          <style>
            :root {
              --bg: #f3f4f6; --surface: #fff; --text: #111827; --muted: #6b7280;
              --border: #d1d5db; --radius: 0.5rem;
              --font: ui-sans-serif, system-ui, sans-serif; --size: 14px;
            }
            * { box-sizing: border-box; }
            body {
              margin: 0; padding: 14px;
              background: var(--bg); color: var(--text);
              font-family: var(--font); font-size: var(--size);
            }
            .grid { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
            @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
            label { display: flex; flex-direction: column; gap: 4px; }
            .lbl { font-size: 12px; font-weight: 600; color: var(--muted); }
            select, input {
              font: inherit; color: inherit; background: var(--surface);
              border: 1px solid var(--border); border-radius: var(--radius);
              padding: 8px 10px; width: 100%;
            }
            select:focus-visible, input:focus-visible {
              outline: 2px solid var(--text); outline-offset: 1px;
            }
            .hint { font-size: 12px; color: var(--muted); margin-top: 2px; }
            .out {
              grid-column: 1 / -1;
              background: var(--surface); border: 1px solid var(--border);
              border-radius: var(--radius); padding: 10px 12px;
              display: grid; grid-template-columns: auto 1fr; gap: 3px 12px;
              font-size: 12px;
            }
            .out dt { color: var(--muted); }
            .out dd {
              margin: 0; font-family: ui-monospace, Menlo, Consolas, monospace;
              overflow-wrap: anywhere;
            }
            .warn { grid-column: 1 / -1; color: #b91c1c; font-size: 12px; }
            /* Muted, not amber. This is information, not a problem: a type was
               chosen and the metric works. Sitting next to the red .warn, any
               warm colour reads as a second error. */
            .note { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
            .hidden { display: none; }
          </style>
          </head>
          <body>

          <div class="grid">
            <label>
              <span class="lbl">Data</span>
              <select id="data"></select>
              <span class="hint" id="dataHint"></span>
            </label>

            <label id="identWrap">
              <span class="lbl" id="identLabel">Serial number</span>
              <input id="ident" autocomplete="off" placeholder="e.g. SN12345">
              <span class="hint" id="identHint">As printed on the beacon, or shown in the Pathfindr portal</span>
            </label>

            <label id="extraWrap" class="hidden">
              <span class="lbl" id="extraLabel">Attribute name</span>
              <input id="extra" autocomplete="off" placeholder="e.g. SAP Order Number">
              <span class="hint">Exactly as it appears in Pathfindr</span>
            </label>

            <dl class="out">
              <dt>Address</dt><dd id="oAddr">-</dd>
              <dt>Path</dt><dd id="oPath">-</dd>
              <dt>Type</dt><dd id="oType">-</dd>
              <dt>Unit</dt><dd id="oUnit">-</dd>
            </dl>

            <div class="warn hidden" id="warn"></div>
            <div class="note hidden" id="note"></div>
          </div>

          <script>
          (function () {
            "use strict";

            var ENVELOPE = "fpDriverUi", VERSION = 1;

            /* Preference lists, not fixed types: the metric schema decides which
               Sparkplug types are legal and we pick the first that is allowed. These
               are written in the Edge Agent's plain spelling; pick_type also matches
               the endian-suffixed forms schemas use, so Int32 here finds Int32LE
               there. */
            var NUM  = ["Float", "Double", "Int32", "Int64"];
            var INT  = ["Int32", "Int64", "Float", "Double"];
            var STR  = ["String"];
            var BOOL = ["Boolean", "Int32", "String"];

            /* The Pathfindr API's shape. This is the same for every customer of the
               vendor, which is why it can live in the driver definition. */
            var CATALOGUE = [
              { id: "loc.zone",    group: "Location", label: "Zone",
                addr: function (s) { return "location/" + s },
                path: "$.location.location", types: STR,
                hint: "The zone the asset was last seen in." },
              { id: "loc.building", group: "Location", label: "Building",
                addr: function (s) { return "location/" + s },
                path: "$.location.building", types: STR,
                hint: "The building the asset was last seen in." },
              { id: "loc.desc",    group: "Location", label: "Location description",
                addr: function (s) { return "location/" + s },
                path: "$.location.description", types: STR,
                hint: "Pathfindr's description of the asset's last known location." },
              { id: "loc.conf",    group: "Location", label: "Location confidence",
                addr: function (s) { return "location/" + s },
                path: "$.confidence", types: INT, unit: "%", low: 0, high: 100,
                hint: "How confident Pathfindr is in the reported location, as a percentage." },
              { id: "loc.seen",    group: "Location", label: "Last seen",
                addr: function (s) { return "location/" + s },
                path: "$.lastseen", types: STR,
                hint: "When the asset was last detected." },
              { id: "loc.timeat",  group: "Location", label: "Time at location",
                addr: function (s) { return "location/" + s },
                path: "$.time_at_location_calc", types: STR,
                hint: "How long the asset has been at its current location." },
              { id: "loc.business", group: "Location", label: "Business",
                addr: function (s) { return "location/" + s },
                path: "$.location.businessname", types: STR,
                hint: "The business area the asset's location belongs to." },
              { id: "bcn.battery", group: "Condition", label: "Beacon battery",
                addr: function (s) { return "beacon/" + s },
                path: "$.battery", types: INT, unit: "%", low: 0, high: 100,
                hint: "The tag's current battery level, as a percentage." },
              { id: "bcn.beat",    group: "Condition", label: "Beacon last heartbeat",
                addr: function (s) { return "beacon/" + s },
                path: "$.last_heartbeat", types: STR,
                hint: "When the tag last reported in." },
              { id: "env.temp",    group: "Condition", label: "Temperature",
                addr: function (s) { return "enviro/" + s },
                path: "$.latest_temperature", types: NUM,
                unit: "°C", low: -20, high: 60,
                hint: "The most recent temperature reading from the tag's sensor." },
              { id: "env.hum",     group: "Condition", label: "Humidity",
                addr: function (s) { return "enviro/" + s },
                path: "$.latest_humidity", types: NUM, unit: "%", low: 0, high: 100,
                hint: "The most recent humidity reading from the tag's sensor." },
              { id: "env.at",      group: "Condition", label: "Reading taken at",
                addr: function (s) { return "enviro/" + s },
                path: "$.recorded_at", types: STR,
                hint: "When the tag last recorded temperature and humidity." },
              { id: "height.cm",   group: "Condition", label: "Height",
                addr: function (s) { return "height/" + s },
                path: "$", types: INT, unit: "cm", low: 0, high: 1000,
                hint: "The asset's last known height above the floor. UWB tags only." },
              { id: "impact.last", group: "Condition", label: "Latest impact",
                addr: function (s) { return "impacthistory/" + s },
                path: "$[0].impact", types: INT,
                hint: "The size of the most recent impact detected by the tag." },
              { id: "fluid.pct",   group: "Condition", label: "Fluid level",
                addr: function (s) { return "fluid/" + s },
                path: "$.reading_percent", types: NUM, unit: "%", low: 0, high: 100,
                hint: "The most recent fluid level reading, as a percentage." },

              { id: "act.mins",    group: "Runtime", label: "Activity duration",
                addr: function (s) { return "activity/" + s },
                path: "$.activity_duration_frame", types: INT, unit: "min", low: 0,
                hint: "How long the asset has been active, in minutes." },
              { id: "act.secs",    group: "Runtime", label: "Activity duration (seconds)",
                addr: function (s) { return "activity/" + s },
                path: "$.activity_duration_seconds_frame", types: INT, unit: "s", low: 0,
                hint: "How long the asset has been active, in seconds." },
              { id: "act.last",    group: "Runtime", label: "Last activity event",
                addr: function (s) { return "activity/" + s },
                path: "$.runtime_last_event", types: STR,
                hint: "When the asset was last active." },
              { id: "rt.total",    group: "Runtime", label: "Runtime hours (total)",
                addr: function (s) { return "runtime/" + s },
                path: "$.runtime_duration_total", types: STR,
                hint: "Total running time, as HH:MM:SS. GPS trackers only." },
              { id: "rt.batv",     group: "Runtime", label: "Tracker battery voltage",
                addr: function (s) { return "runtime/" + s },
                path: "$.battery_v", types: NUM, unit: "V", low: 0, high: 5,
                hint: "The GPS tracker's battery voltage. BLE tags report Beacon battery instead." },

              { id: "attr",        group: "Asset", label: "Custom attribute",
                addr: function (s) { return "attrs/" + s },
                path: null, types: STR, extra: "Attribute name",
                hint: "A site-defined field from the asset's record in Pathfindr." },
              { id: "asset.part",  group: "Asset", label: "Part number",
                addr: function (s) { return "assets/" + s },
                path: "$.partno", types: STR,
                hint: "The part number the asset was launched with." },
              { id: "asset.status", group: "Asset", label: "Status",
                addr: function (s) { return "assets/" + s },
                path: "$.status", types: STR,
                hint: "The asset's lifecycle status in Pathfindr." },
              { id: "bld.name",    group: "Site", label: "Building name",
                ident: "id", addr: function (s) { return "buildings/" + s },
                path: "$.name", types: STR,
                hint: "The building's name in Pathfindr." },
              { id: "bld.site",    group: "Site", label: "Building site",
                ident: "id", addr: function (s) { return "buildings/" + s },
                path: "$.site", types: STR,
                hint: "The site the building belongs to." },
              { id: "cell.zones",  group: "Site", label: "Zones in a cell",
                ident: "id", addr: function (s) { return "cells/" + s + "/zones" },
                path: "$", types: STR,
                hint: "Every zone in the cell, as JSON." }
            ];

            var el = function (id) { return document.getElementById(id) };
            var allowed = [];
            var initialised = false;

            function post (msg) {
              msg[ENVELOPE] = VERSION;
              parent.postMessage(msg, "*");
            }

            function report_height () {
              /* Measure the body, not documentElement. documentElement.scrollHeight
                 returns max(viewport, content), so once the embedder has sized the
                 frame to our reported height we would just measure that height back
                 and the panel could only ever grow. */
              var h = document.body ? document.body.getBoundingClientRect().height : 0;
              post({ type: "resize", height: Math.ceil(h) + 28 });
            }

            function build_options () {
              var sel = el("data"), groups = {};
              CATALOGUE.forEach(function (item) {
                if (!groups[item.group]) {
                  var g = document.createElement("optgroup");
                  g.label = item.group;
                  groups[item.group] = g;
                  sel.appendChild(g);
                }
                var o = document.createElement("option");
                o.value = item.id;
                o.textContent = item.label;
                groups[item.group].appendChild(o);
              });
            }

            /* Show the Sparkplug type each choice will produce, once the schema has
               told us which types it permits.

               It is appended to the label rather than set beside it in muted text,
               because a native select renders its options through the OS and neither
               styling nor alignment inside one is available. Replacing the select with
               a custom listbox would buy the nicer look at the cost of a lot of code
               and all the keyboard and screen reader behaviour that comes free here.

               The type shown is the one actually resolved against this metric's
               schema, so it reads Int32LE where the schema spells it that way rather
               than a generic Int32 the metric would reject. */
            function label_options () {
              var sel = el("data");
              CATALOGUE.forEach(function (item) {
                var o = sel.querySelector('option[value="' + item.id + '"]');
                if (!o) return;
                var t = pick_type(item.types).type;
                o.textContent = t ? item.label + "  (" + t + ")" : item.label;
              });
            }

            function current () {
              var id = el("data").value;
              for (var i = 0; i < CATALOGUE.length; i++)
                if (CATALOGUE[i].id === id) return CATALOGUE[i];
              return CATALOGUE[0];
            }

            /* Choose the first preferred type the metric schema actually permits. */
            /* Two vocabularies are in play. The Edge Agent names its types plainly,
               Int32, and schemas frequently name them with byte order, Int32LE. A
               schema metric called "Int" offers Int8, Int16LE, Int16BE, Int32LE,
               Int32BE, Int64LE, Int64BE and no plain Int32 at all.

               Byte order is meaningless here anyway: this driver publishes JSON, and
               endianness only matters when decoding a raw buffer. So match on the base
               name and let the schema decide which spelling is legal. */
            function base_type (t) {
              return String(t).replace(/(LE|BE)$/, "");
            }

            /* Choose a Sparkplug type for the selected data. Returns the type and how
               it was arrived at, so the caller can say when it settled for something
               unnatural.

               The permitted set is per-metric and chosen by whoever wrote the schema,
               so it can be a single Int64, only unsigned types, or only String. When
               nothing suitable is allowed, take whatever is, because a type the
               operator can correct beats a panel that fills in nothing. */
            function pick_type (prefs) {
              if (!allowed.length) return { type: prefs[0], exact: true };

              var i, j;

              for (i = 0; i < prefs.length; i++)
                if (allowed.indexOf(prefs[i]) !== -1)
                  return { type: prefs[i], exact: true };

              for (i = 0; i < prefs.length; i++)
                for (j = 0; j < allowed.length; j++)
                  if (base_type(allowed[j]) === prefs[i])
                    return { type: allowed[j], exact: true };

              /* The empty string is the schema's way of saying "None". */
              for (j = 0; j < allowed.length; j++)
                if (allowed[j]) return { type: allowed[j], exact: false };

              return { type: null, exact: false };
            }

            function apply_theme (theme) {
              if (!theme) return;
              var map = {
                background: "--bg", surface: "--surface", text: "--text",
                textMuted: "--muted", border: "--border", radius: "--radius",
                fontFamily: "--font", fontSize: "--size"
              };
              Object.keys(map).forEach(function (k) {
                if (theme[k]) document.documentElement.style.setProperty(map[k], theme[k]);
              });
            }

            function render () {
              var item = current();
              var wantsId = item.ident === "id";

              el("identLabel").textContent = wantsId ? "Pathfindr ID" : "Serial number";
              el("identHint").textContent = wantsId
                ? "The numeric id shown in the Pathfindr portal"
                : "As printed on the beacon, or shown in the Pathfindr portal";
              el("ident").placeholder = wantsId ? "e.g. 55" : "e.g. SN12345";
              el("dataHint").textContent = item.hint || "";
              el("extraWrap").className = item.extra ? "" : "hidden";
              if (item.extra) el("extraLabel").textContent = item.extra;

              var ident  = el("ident").value.trim();
              var extra  = el("extra").value.trim();
              var picked = pick_type(item.types);
              var type   = picked.type;

              var problems = [];
              if (!ident) problems.push("Enter a " + (wantsId ? "Pathfindr ID" : "serial number") + ".");
              if (wantsId && ident && !/^[0-9]+$/.test(ident))
                problems.push("The Pathfindr ID must be a number.");
              if (!wantsId && /[\/?#&]/.test(ident))
                problems.push("A serial number cannot contain / ? # or &.");
              if (item.extra && !extra) problems.push("Enter the attribute name.");
              /* Only reachable when the schema permits no type at all, since pick_type
               * otherwise falls back to whatever is allowed. Always name what was on
               * offer: "no" without "here is what there is" leaves nowhere to go. */
              if (!type) {
                problems.push(allowed.length
                  ? "This metric allows no usable Sparkplug type. It allows: "
                    + allowed.join(", ") + "."
                  : "This metric's schema lists no Sparkplug types.");
              }

              var warn = el("warn");
              warn.textContent = problems.join(" ");
              warn.className = problems.length ? "warn" : "warn hidden";

              /* Not an error: a type was chosen and the metric will work. But it is not
                 one this data would naturally use, so say which was picked and what the
                 schema actually permits, rather than quietly setting something odd. */
              var note = el("note");
              if (!problems.length && type && !picked.exact) {
                note.textContent = "Using " + type + ". This metric allows only: "
                  + allowed.filter(Boolean).join(", ") + ".";
                note.className = "note";
              }
              else {
                note.textContent = "";
                note.className = "note hidden";
              }

              if (problems.length) {
                el("oAddr").textContent = "-";
                el("oPath").textContent = "-";
                el("oType").textContent = "-";
                el("oUnit").textContent = "-";
                report_height();
                return;
              }

              var address = item.addr(ident);
              /* JSONPath bracket form, so attribute names with spaces work. */
              var path = item.path !== null
                ? item.path
                : "$['" + extra.replace(/'/g, "\\'") + "']";

              el("oAddr").textContent = address;
              el("oPath").textContent = path;
              el("oType").textContent = type;
              el("oUnit").textContent = item.unit || "-";

              var values = {
                Address:        address,
                Path:           path,
                Sparkplug_Type: type,
                Eng_Unit:       item.unit || null
              };
              if (typeof item.low  === "number") values.Eng_Low  = item.low;
              if (typeof item.high === "number") values.Eng_High = item.high;

              post({ type: "propose", values: values });
              report_height();
            }

            /* Recover the panel's state from a metric that was configured earlier, so
               reopening it does not silently reset what the operator already set. */
            function restore (metric) {
              if (!metric || !metric.Address) return;
              var addr = String(metric.Address);
              var slash = addr.indexOf("/");
              if (slash < 0) return;

              var head = addr.slice(0, slash);
              var rest = addr.slice(slash + 1);
              var ident = rest.indexOf("/") >= 0 ? rest.slice(0, rest.indexOf("/")) : rest;

              for (var i = 0; i < CATALOGUE.length; i++) {
                var item = CATALOGUE[i];
                if (item.addr(ident) !== addr) continue;
                if (item.path !== null && item.path !== metric.Path) continue;
                el("data").value = item.id;
                el("ident").value = ident;
                if (item.path === null && metric.Path) {
                  var m = /^\$\['(.*)'\]$/.exec(String(metric.Path));
                  if (m) el("extra").value = m[1].replace(/\\'/g, "'");
                }
                return;
              }
            }

            window.addEventListener("message", function (event) {
              if (event.source !== parent) return;
              var d = event.data;
              if (!d || typeof d !== "object" || d[ENVELOPE] !== VERSION) return;
              if (d.type !== "init" || initialised) return;

              initialised = true;
              allowed = (d.constraints && d.constraints.allowed_types) || [];
              apply_theme(d.theme);
              label_options();
              restore(d.metric);
              render();
            });

            build_options();
            el("data").addEventListener("change", render);
            el("ident").addEventListener("input", render);
            el("extra").addEventListener("input", render);
            window.addEventListener("resize", report_height);

            /* Announce only once listeners are attached, so init cannot race us. */
            post({ type: "ready" });
          }());
          </script>
          </body>
          </html>
        # END metric-panel.html
      schema:
        properties:
          baseURL:
            description: "The Pathfindr host you log into, e.g.
              https://portal.pathfindr.co.uk. The vendor docs write this as
              [subdomain].pathfindr.co.uk, but there is no per-customer
              wildcard: it is the same host as your portal."
            minLength: 1
            options:
              order: 1
            title: "Base URL"
            type: string
          clientId:
            minLength: 1
            options:
              order: 2
            title: "Client ID"
            type: string
          clientSecret:
            format: password
            minLength: 1
            options:
              order: 3
            title: "Client Secret"
            type: string
          cacheMs:
            default: 60000
            description: "How long a collection sweep is reused, in
              milliseconds. Pathfindr allows 120 calls a minute across the
              whole tenant, so shortening this on a large estate risks
              exhausting the budget."
            options:
              order: 4
            title: "Cache Window (ms)"
            type: number
          rateLimit:
            default: 110
            description: "Maximum API calls per minute. Kept below the
              documented 120 so the driver throttles itself rather than
              being throttled."
            options:
              order: 5
            title: "Rate Limit (calls/min)"
            type: number
          maxPages:
            default: 20
            description: "Pages fetched per collection sweep, 100 assets a
              page. A sweep that hits this cap is logged; assets beyond it
              will not report."
            options:
              order: 6
            title: "Maximum Pages"
            type: number
          timeout:
            default: 15000
            options:
              order: 7
            title: "Request Timeout (ms)"
            type: number
          filterPartNo:
            description: "Optional. Restrict this connection to one part
              number, to keep a large estate inside the rate limit."
            options:
              order: 8
            title: "Filter by Part Number"
            type: string
          filterSerial:
            description: "Optional. Restrict this connection to one serial
              number."
            options:
              order: 9
            title: "Filter by Serial Number"
            type: string
        required:
          - baseURL
          - clientId
          - clientSecret
        title: "Pathfindr Connection Details"
        type: object

    # The split drivers that replaced the Edge Agent's built-in REST,
    # MQTT, OPC UA and UDP connections in ACS 7. They have the built-in
    # connections' forms, so connection details keep their field names.
    # Service-setup moves every connection still on a built-in driver
    # to these on upgrade (lib/split-drivers.js). The built-in
    # DriverDefs are not loaded any more, and service-setup marks them
    # hidden (lib/retired-drivers.js).
    !u ACS.Driver.RESTSplit:
      polled: true
      presentation:
        address:
          title: "REST Endpoint"
          description: "The path following the domain in a REST call URL (e.g. /status)"
          icon: "globe"
          placeholder: "e.g. /api/status"
        path:
          title: "JSON Path"
          description: "JSONPath notation to extract specific values from the JSON response (e.g. $.status.value)"
          icon: "code"
          placeholder: "e.g. $.data.value"
      image:
        repository: edge-rest
      schema:
        properties:
          authMethod:
            default: None
            enum:
              - None
              - Basic
            minLength: 1
            title: Authentication Method
            type: string
          baseURL:
            minLength: 1
            title: Base URL
            type: string
          password:
            format: password
            minLength: 1
            options:
              dependencies:
                authMethod: Basic
            title: Password
            type: string
          username:
            minLength: 1
            options:
              dependencies:
                authMethod: Basic
            title: Username
            type: string
        required:
          - baseURL
          - authMethod
        title: REST Connection Details
        type: object
    !u ACS.Driver.MQTTSplit:
      polled: false
      presentation:
        address:
          title: "Topic"
          description: "The MQTT topic to subscribe to (e.g. device/+/data or factory/area1/#)"
          icon: "exchange-alt"
          placeholder: "e.g. /robot01/axis/1/position"
        path:
          title: "JSON Path"
          description: "JSONPath notation to extract specific values from the message payload (e.g. $.data.temperature)"
          icon: "code"
          placeholder: "e.g. $.value"
      # Edge Scout listens on a second, short-lived client for a few
      # seconds. A quiet topic is not found, so a scan never says a
      # topic has gone.
      scout:
        title: "Listen for topics on the broker"
        address_form: mqtt
        options:
          type: object
          properties:
            filters:
              title: "Topic filters"
              description: "The filters to listen on. Topics starting with $ are skipped unless a filter names them."
              type: array
              minItems: 1
              items:
                type: string
                minLength: 1
              default: ["#"]
            seconds:
              title: "Listen for (seconds)"
              type: integer
              minimum: 1
              maximum: 120
              default: 10
            inspect_bytes:
              title: "Inspect payloads up to (bytes)"
              description: "JSON payloads up to this size are split into one address per leaf"
              type: integer
              minimum: 0
              default: 65536
            json_leaves:
              title: "List JSON leaves"
              type: boolean
              default: true
            client_id:
              title: "Client ID"
              description: "The scan's MQTT client ID. Leave empty to derive one from the connection's client ID."
              type: string
        share_samples: false
      image:
        repository: edge-mqtt
      schema:
        properties:
          host:
            minLength: 1
            title: Hostname/IP
            type: string
            options:
              order: 1
          port:
            default: 1883
            minLength: 1
            title: Port
            type: number
            options:
              order: 2
          protocol:
            default: mqtt
            enum:
              - mqtt
              - mqtts
              - tcp
              - tls
              - ws
              - wss
            minLength: 1
            title: Protocol
            type: string
            options:
              order: 3
          clientId:
            title: Client ID
            type: string
            options:
              order: 4
              inputAttributes:
                placeholder: Leave blank for auto generation
          username:
            title: Username
            type: string
            options:
              order: 5
          password:
            format: password
            title: Password
            type: string
            options:
              order: 6
          cleanSession:
            default: true
            format: checkbox
            title: Clean Session
            type: boolean
            options:
              order: 7
          keepAlive:
            default: 60
            title: Keep Alive Interval (sec)
            type: number
            options:
              order: 8
          useSSL:
            format: checkbox
            title: Use SSL?
            type: boolean
            options:
              order: 9
        required:
          - host
          - port
          - protocol
        title: MQTT Server Details
        type: object
    # OPC UA's split driver sends each value as `{"value", "timestamp"}`,
    # with nothing for a metric path to select, so its metrics take no
    # path: the admin UI leaves it out and a move here clears it
    # (`metricPaths`, takes_metric_paths in lib/js-service-client).
    !u ACS.Driver.OPCUASplit:
      polled: true
      metricPaths: false
      presentation:
        address:
          title: "Node ID"
          description: "The OPC UA Node ID in format ns=X;s=PATH or i=X (e.g. ns=2;s=/Channel/Spindle/actSpeed). Add [3] for one element of an array node, [2:5] for elements 2 to 5, or [1,2] for one element of a 2D array (e.g. ns=2;s=Line1/Temps[3])"
          icon: "sitemap"
          placeholder: "e.g. ns=2;s=/Channel/Spindle/actSpeed"
        path:
          hidden: true
      # Edge Scout browses from Objects (i=85) and skips the Server
      # object (i=2253) unless include_server is set, so mapped
      # CurrentTime and ServerStatus metrics are never called missing.
      scout:
        title: "Scan the server's address space"
        address_form: opcua
        options:
          type: object
          properties:
            root:
              title: "Start at"
              description: "The node to browse from, e.g. ns=2;s=Line1. Leave empty to start at Objects."
              type: string
            include_server:
              title: "Include the Server object"
              type: boolean
              default: false
            units:
              title: "Read engineering units"
              type: boolean
              default: false
            expand_arrays:
              title: "List array elements"
              description: "List each element of an array of up to 64 elements as its own address"
              type: boolean
              default: false
        share_samples: false
      image:
        repository: edge-opcua
      # Its client certificate lives here, for as long as the pod, as
      # the built-in's did, so a server that trusts it keeps trusting
      # it across container restarts.
      stateDir: /var/lib/edge-driver
      schema:
        properties:
          endpoint:
            minLength: 1
            title: Endpoint
            type: string
            pattern: ^opc\.tcp://[^/]+:\d+(/.*)?$
            options:
              order: 1
              inputAttributes:
                placeholder: e.g. opc.tcp://myserver:1234
              patternmessage: This doesn't look like a valid OPC UA address (opc.tcp://host:port or opc.tcp://host:port/path).
          securityMode:
            default: None
            enum:
              - None
              - Sign
              - SignAndEncrypt
            minLength: 1
            title: Security Mode
            type: string
            options:
              order: 2
          securityPolicy:
            default: None
            enum:
              - None
              - Basic128
              - Basic192
              - Basic192Rsa15
              - Basic256Rsa15
              - Basic256Sha256
              - Aes128_Sha256
              - Aes128_Sha256_RsaOaep
              - PubSub_Aes128_CTR
              - PubSub_Aes256_CTR
              - Basic128Rsa15
              - Basic256
            minLength: 1
            title: Security Policy
            type: string
            options:
              order: 3
          useCredentials:
            format: checkbox
            title: Use credentials
            type: boolean
            options:
              order: 4
          username:
            minLength: 1
            title: Username
            type: string
            options:
              order: 5
              dependencies:
                useCredentials: true
          password:
            format: password
            minLength: 1
            title: Password
            type: string
            options:
              order: 6
              dependencies:
                useCredentials: true
        required:
          - endpoint
          - securityPolicy
          - securityMode
          - useCredentials
        title: OPC-UA Server Details
        type: object
    # The address field can't be hidden (the Admin UI only hides the
    # path), and every datagram goes to the empty address, so the form
    # says to leave it empty.
    !u ACS.Driver.UDPSplit:
      polled: false
      presentation:
        address:
          title: "Address (leave empty)"
          description: "Leave this empty. Every datagram arrives on the empty address, so a metric with anything here never gets a value. The port is set on the connection."
          icon: "network-wired"
          placeholder: "Leave empty"
        path:
          title: "Data Selector"
          description: "Where the value is in each datagram, in the device's payload format: a JSONPath for JSON (e.g. $.x), a byte offset for Buffer (e.g. 4), or a field number for Delimited String (e.g. 2)"
          icon: "filter"
          placeholder: "e.g. $.x or 4"
      image:
        repository: edge-udp
      # The driver listens on the connection's port, and the chart
      # opens it on the node so devices outside the cluster can send
      # to it (driver_ports in lib/js-service-client).
      hostPorts:
        - protocol: UDP
          field: port
      # The built-in's form allowed only port 50205.
      schema:
        properties:
          port:
            default: 50205
            description: "The UDP port the device sends to. It is opened on the host the Edge Agent runs on, so it must be free there."
            minimum: 1
            maximum: 65535
            title: Port
            type: number
            options:
              order: 1
        required:
          - port
        title: UDP Server Details
        type: object

    !u ACS.Driver.External:
      polled: false
      presentation:
        address:
          title: "Address"
          description: "The address for the external driver (format depends on the specific external driver)"
          icon: "puzzle-piece"
          placeholder: "Enter address"
        path:
          title: "Path"
          description: "The path for the external driver (format depends on the specific external driver)"
          icon: "folder-tree"
          placeholder: "Enter path"
      external: true

  # Edge Scout: the status and values entries' schemas. These are
  # copies of status.schema.json and values.schema.json in
  # lib/edge-scout-schemas/schemas, written as JSON, which is also YAML.
  # test/edge-scout.test.js fails when they differ, so copy each file
  # here whenever it changes.
  !u UUIDs.App.ConfigSchema:
    !u Edge.App.ScoutStatus:
      {
          "$schema": "https://json-schema.org/draft/2020-12/schema",
          "$id": "urn:edge-scout:status",
          "title": "Edge scout status",
          "description": "The scan status of one connection, kept in ConfigDB under the Edge scout status app and keyed by the connection's UUID. Only the Edge Agent writes it. This schema is self-contained because ConfigDB loads it as the app's ConfigSchema.",
          "type": "object",
          "required": ["version", "node", "supported"],
          "additionalProperties": false,
          "properties": {
              "version": { "const": 1 },
              "node": { "$ref": "#/$defs/uuid" },
              "supported": { "enum": [true, false, "library", null] },
              "reads": { "enum": [true, false, null] },
              "scan": { "$ref": "#/$defs/uuid_or_null" },
              "request": { "$ref": "#/$defs/uuid_or_null" },
              "state": { "enum": ["queued", "running", "done", "failed", "cancelled", null] },
              "code": {
                  "enum": ["UNSUPPORTED", "OPTIONS", "CONN", "AUTH", "CANCELLED", "ERR",
                           "REQUEST", "UNDEPLOYED", "NODRIVER", "LIBRARY", "BUSY", "LIMIT", "NOTRUNNING",
                           "NOREADS", "TIMEOUT", "LOST", "INTERRUPTED", "STORE", "AGENT", null]
              },
              "message": { "type": ["string", "null"], "maxLength": 512 },
              "started": { "$ref": "#/$defs/timestamp_or_null" },
              "updated": { "$ref": "#/$defs/timestamp_or_null" },
              "finished": { "$ref": "#/$defs/timestamp_or_null" },
              "root": { "type": ["string", "null"], "maxLength": 1024 },
              "folder_id": { "type": ["string", "null"], "minLength": 1, "maxLength": 1024 },
              "options_hash": { "$ref": "#/$defs/hash_or_null" },
              "config_hash": { "$ref": "#/$defs/hash_or_null" },
              "progress": {
                  "oneOf": [
                      { "type": "null" },
                      {
                          "type": "object",
                          "required": ["visited", "found"],
                          "additionalProperties": false,
                          "properties": {
                              "visited": { "type": "integer", "minimum": 0 },
                              "found": { "type": "integer", "minimum": 0 },
                              "note": { "type": ["string", "null"], "maxLength": 512 }
                          }
                      }
                  ]
              },
              "last_request": {
                  "oneOf": [
                      { "type": "null" },
                      {
                          "type": "object",
                          "required": ["request", "code", "at"],
                          "additionalProperties": false,
                          "properties": {
                              "request": { "$ref": "#/$defs/uuid_or_null" },
                              "code": {
                                  "enum": ["REQUEST", "UNDEPLOYED", "NODRIVER", "LIBRARY", "BUSY",
                                           "LIMIT", "NOTRUNNING", "NOREADS", null]
                              },
                              "message": { "type": ["string", "null"], "maxLength": 512 },
                              "at": { "$ref": "#/$defs/timestamp" }
                          }
                      }
                  ]
              },
              "current": { "$ref": "#/$defs/snapshot_ref" },
              "previous": { "$ref": "#/$defs/snapshot_ref" }
          },
          "$defs": {
              "uuid": {
                  "type": "string",
                  "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
              },
              "uuid_or_null": {
                  "oneOf": [{ "type": "null" }, { "$ref": "#/$defs/uuid" }]
              },
              "timestamp": { "type": "string", "format": "date-time" },
              "timestamp_or_null": {
                  "oneOf": [{ "type": "null" }, { "$ref": "#/$defs/timestamp" }]
              },
              "hash": { "type": "string", "pattern": "^sha256:[0-9a-f]{64}$" },
              "hash_or_null": {
                  "oneOf": [{ "type": "null" }, { "$ref": "#/$defs/hash" }]
              },
              "excluded_scope": {
                  "type": "object",
                  "required": ["id", "reason"],
                  "additionalProperties": false,
                  "properties": {
                      "id": { "type": "string", "minLength": 1, "maxLength": 256 },
                      "reason": { "type": "string", "minLength": 1, "maxLength": 32 },
                      "prefixes": {
                          "type": "array",
                          "maxItems": 4,
                          "items": { "type": "string", "minLength": 1, "maxLength": 256 }
                      }
                  }
              },
              "snapshot_ref": {
                  "oneOf": [
                      { "type": "null" },
                      {
                          "type": "object",
                          "required": ["file", "items", "bytes_gz", "exhaustive", "truncated", "reason",
                                       "finished", "root", "options_hash", "config_hash", "excluded", "branches"],
                          "additionalProperties": false,
                          "properties": {
                              "file": { "$ref": "#/$defs/uuid" },
                              "items": { "type": "integer", "minimum": 0 },
                              "bytes_gz": { "type": "integer", "minimum": 0 },
                              "exhaustive": { "type": "boolean" },
                              "truncated": { "type": "boolean" },
                              "reason": { "enum": ["items", "depth", "seconds", "size", "partial_access", null] },
                              "finished": { "$ref": "#/$defs/timestamp" },
                              "root": { "type": ["string", "null"], "maxLength": 1024 },
                              "options_hash": { "$ref": "#/$defs/hash" },
                              "config_hash": { "$ref": "#/$defs/hash_or_null" },
                              "excluded": {
                                  "type": "array",
                                  "maxItems": 8,
                                  "items": { "$ref": "#/$defs/excluded_scope" }
                              },
                              "branches": {
                                  "type": "array",
                                  "maxItems": 10,
                                  "items": {
                                      "type": "object",
                                      "required": ["folder_id", "finished"],
                                      "additionalProperties": false,
                                      "properties": {
                                          "folder_id": { "type": "string", "minLength": 1, "maxLength": 1024 },
                                          "finished": { "$ref": "#/$defs/timestamp" }
                                      }
                                  }
                              }
                          }
                      }
                  ]
              }
          }
      }
    !u Edge.App.ScoutValues:
      {
          "$schema": "https://json-schema.org/draft/2020-12/schema",
          "$id": "urn:edge-scout:values",
          "title": "Edge scout values",
          "description": "The live values of one connection, kept in ConfigDB under the Edge scout values app and keyed by the connection's UUID. Only the Edge Agent writes it, while the Admin UI holds a lease. An entry with leases 0 and no values means nobody is watching. This schema is self-contained because ConfigDB loads it as the app's ConfigSchema.",
          "type": "object",
          "required": ["version", "node", "updated", "leases", "values"],
          "additionalProperties": false,
          "properties": {
              "version": { "const": 1 },
              "node": {
                  "type": "string",
                  "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
              },
              "updated": { "$ref": "#/$defs/timestamp" },
              "interval_ms": {
                  "description": "How often the agent reads, in ms.",
                  "type": "integer",
                  "minimum": 0
              },
              "leases": {
                  "description": "The live leases on the connection.",
                  "type": "integer",
                  "minimum": 0,
                  "maximum": 4
              },
              "dropped": {
                  "description": "Addresses left out because the leases asked for more than 40.",
                  "type": "integer",
                  "minimum": 0
              },
              "values": {
                  "type": "object",
                  "maxProperties": 40,
                  "propertyNames": { "type": "string", "minLength": 1, "maxLength": 1024 },
                  "additionalProperties": {
                      "type": "object",
                      "required": ["value", "type", "ts", "read", "error"],
                      "additionalProperties": false,
                      "properties": {
                          "value": { "type": ["string", "null"], "maxLength": 1024 },
                          "type": {
                              "enum": ["Int8", "Int16", "Int32", "Int64", "UInt8", "UInt16", "UInt32", "UInt64",
                                       "Float", "Double", "Boolean", "String", "Text", "DateTime", "UUID",
                                       "Bytes", "File", "DataSet", "Template", null]
                          },
                          "ts": {
                              "description": "The source timestamp in ms since the epoch, or null.",
                              "type": ["integer", "null"]
                          },
                          "read": {
                              "description": "When the agent got the value.",
                              "$ref": "#/$defs/timestamp"
                          },
                          "error": { "type": ["string", "null"], "maxLength": 256 }
                      }
                  }
              }
          },
          "$defs": {
              "timestamp": { "type": "string", "format": "date-time" }
          }
      }

  # Edge Scout: the command the Addresses panel sends through cmdesc.
  !u CmdEsc.App.CmdDef:
    !u Edge.Perm.Scout:
      - name: Node Control/Scout
        type: String
---
service: !u UUIDs.Service.Authentication
version: 2
grants:
  !u ACS.Group.CentralMonitor:
    !u ACS.Role.EdgeNodeConsumer:
      !u ACS.Device.ConfigDB: false
    !u UUIDs.Permission.ConfigDB.ReadConfig:
      !u Edge.App.ClusterStatus: false
      !u UUIDs.App.SparkplugAddress: false
