#-REQUIRE: auth sparkplug
---
service: !u UUIDs.Service.ConfigDB
version: 2
objects:
  !u ConfigDB.Class.R2Class:
    !u Edge.Group.EdgeGroup:
      name: "Edge-managed group"
      subclassOf:
        - !u Auth.Class.EdgeRole

  !u ConfigDB.Class.R1Class:
    !u Edge.Class.Connection:
      name: "Edge Agent connection"
    # XXX I'm not certain a Driver shouldn't be a class of connections?
    !u Edge.Class.Driver:
      name: "Edge Agent driver"

  # Not currently used. This would be difficult to implement with the
  # current implementation of composite perms as classes; we don't
  # support multi-rank classes yet.
  !u Auth.Class.PermissionGroup:
    !u Edge.Group.EdgePermission:
      name: "Edge-managed permissions"
      subclassOf:
        - !u Auth.Class.Permission

  !u Auth.Class.ServiceRole:
    !u ACS.Group.CentralMonitor:
      name: "Central monitor"
      subclassOf:
        - !u Auth.Class.CentralService
        - !u ACS.Group.SparkplugNode
        - !u ACS.Group.SparkplugReader

  !u UUIDs.Class.App:
    !u Edge.App.ClusterStatus:
      name: "Edge cluster status"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry
    !u Edge.App.ConnConfig:
      name: "Connection config"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry
    !u Edge.App.Deployment:
      name: "Edge deployment"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry
    !u Edge.App.DriverDef:
      name: "Driver definition"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry

  !u Edge.Class.Driver:
    !u ACS.Driver.REST:             { name: "REST" }
    !u ACS.Driver.MTConnect:        { name: "MTConnect" }
    !u ACS.Driver.S7:               { name: "S7" }
    !u ACS.Driver.OPCUA:            { name: "OPC-UA" }
    !u ACS.Driver.MQTT:             { name: "MQTT" }
    !u ACS.Driver.UDP:              { name: "UDP" }
    !u ACS.Driver.Bacnet:           { name: "Bacnet" }
    !u ACS.Driver.Modbus:           { name: "Modbus" }
    !u ACS.Driver.Test:             { name: "Test" }
    !u ACS.Driver.TPlinkSmartPlug:  { name: "TP-Link smart plug" }
    !u ACS.Driver.External:         { name: "External driver" }
    !u ACS.Driver.ADS:              { name: "ADS" }
    !u ACS.Driver.RTDE:             { name: "RTDE" }
    !u ACS.Driver.Pathfindr:        { name: "Pathfindr" }

configs:
  # Driver Definition Configuration
  # UI customization is done through the 'presentation' key with the following structure:
  #
  # presentation:
  #   address:                    # Configuration for the address field
  #     title: "Device Address"   # Title for the address field
  #     description: "..."        # Help text for the address field
  #     icon: "microchip"        # Font Awesome icon name (without the fa- prefix)
  #     placeholder: "..."       # Placeholder text for the address input
  #   path:                       # Configuration for the path field
  #     title: "Metric Path"     # Title for the path field
  #     description: "..."        # Help text for the path field
  #     icon: "code"             # Font Awesome icon name (without the fa- prefix)
  #     placeholder: "..."       # Placeholder text for the path input
  #     hidden: false             # Set to true to hide the path field (defaults to false)
  #
  # Example for a new driver:
  # !u ACS.Driver.NewDriver:
  #   polled: true
  #   presentation:
  #     address:
  #       title: "Device ID"
  #       description: "The device identifier"
  #       icon: "microchip"
  #       placeholder: "e.g. device123"
  #     path:
  #       title: "Parameter"
  #       description: "The parameter to access"
  #       icon: "code"
  #       placeholder: "e.g. temperature"
  #       hidden: false
  !u Edge.App.DriverDef:
    !u ACS.Driver.REST:
      polled: true
      presentation:
        address:
          title: "REST Endpoint"
          description: "The path following the domain in a REST call URL (e.g. /status)"
          icon: "globe"
          placeholder: "e.g. /api/status"
        path:
          title: "JSON Path"
          description: "JSONPath notation to extract specific values from the JSON response (e.g. $.status.value)"
          icon: "code"
          placeholder: "e.g. $.data.value"
      internal:
        connType: REST
        details: RESTConnDetails
      schema:
        properties:
          authMethod:
            default: None
            enum:
              - None
              - Basic
            minLength: 1
            title: Authentication Method
            type: string
          baseURL:
            minLength: 1
            title: Base URL
            type: string
          password:
            format: password
            minLength: 1
            options:
              dependencies:
                authMethod: Basic
            title: Password
            type: string
          username:
            minLength: 1
            options:
              dependencies:
                authMethod: Basic
            title: Username
            type: string
        required:
          - baseURL
          - authMethod
        title: REST Connection Details
        type: object
    !u ACS.Driver.MTConnect:
      polled: true
      presentation:
        address:
          title: "MTConnect Endpoint"
          description: "The path following the domain in a REST call URL (usually /current)"
          icon: "industry"
          placeholder: "e.g. /current"
        path:
          title: "XML Path"
          description: "XPath notation to extract specific values from the XML response (e.g. //*[@componentId='x']//*[@dataItemId='xp']/text())"
          icon: "code-branch"
          placeholder: "e.g. //*[@dataItemId='temperature']/text()"
      internal:
        connType: MTConnect
        details: MTConnectConnDetails
      schema:
        properties:
          baseURL:
            minLength: 1
            title: Base URL
            type: string
            options:
              order: 1
          authMethod:
            default: None
            enum:
              - None
              - Basic
            minLength: 1
            title: Authentication Method
            type: string
            options:
              order: 2
          username:
            minLength: 1
            title: Username
            type: string
            options:
              order: 3
              dependencies:
                authMethod: Basic
          password:
            format: password
            minLength: 1
            title: Password
            type: string
            options:
              order: 4
              dependencies:
                authMethod: Basic
        required:
          - baseURL
          - authMethod
        title: MTConnect Connection Details
        type: object
    !u ACS.Driver.S7:
      polled: true
      presentation:
        address:
          title: "Memory Address"
          description: "Database memory address given as %aa####.* where aa determines the variable type (e.g. %I=input bit, %Q=output bit, %IB=input byte, %QB=output byte, %IW=input word, %QW=output word, %ID=input double word, %QD=output double word)"
          icon: "microchip"
          placeholder: "e.g. %QD1026 or %Q1194.0"
        path:
          hidden: true
      internal:
        connType: S7
        details: s7ConnDetails
      schema:
        properties:
          hostname:
            minLength: 1
            title: Hostname/IP Address
            type: string
            options:
              order: 1
          port:
            default: 102
            minLength: 1
            title: Port
            type: number
            options:
              order: 2
          rack:
            minLength: 1
            title: Rack
            type: number
            options:
              order: 3
          slot:
            minLength: 1
            title: Slot
            type: number
            options:
              order: 4
          timeout:
            default: 5000
            minLength: 1
            title: Timeout
            type: number
            options:
              order: 5
        required:
          - hostname
          - port
          - rack
          - slot
          - timeout
        title: S7 Connection Details
        type: object
    !u ACS.Driver.OPCUA:
      polled: true
      presentation:
        address:
          title: "Node ID"
          description: "The OPC UA Node ID in format ns=X;s=PATH or i=X (e.g. ns=2;s=/Channel/Spindle/actSpeed)"
          icon: "sitemap"
          placeholder: "e.g. ns=2;s=/Channel/Spindle/actSpeed"
        path:
          hidden: true
      internal:
        connType: OPC UA
        details: OPCUAConnDetails
      schema:
        properties:
          endpoint:
            minLength: 1
            title: Endpoint
            type: string
            pattern: ^opc.tcp://.+:\d+/?$
            options:
              order: 1
              inputAttributes:
                placeholder: e.g. opc.tcp://myserver:1234
              patternmessage: This doesn't look like a valid OPC UA address (opc.tcp://host:port).
          securityMode:
            default: None
            enum:
              - None
              - Sign
              - SignAndEncrypt
            minLength: 1
            title: Security Mode
            type: string
            options:
              order: 2
          securityPolicy:
            default: None
            enum:
              - None
              - Basic128
              - Basic192
              - Basic192Rsa15
              - Basic256Rsa15
              - Basic256Sha256
              - Aes128_Sha256
              - Aes128_Sha256_RsaOaep
              - PubSub_Aes128_CTR
              - PubSub_Aes256_CTR
              - Basic128Rsa15
              - Basic256
            minLength: 1
            title: Security Policy
            type: string
            options:
              order: 3
          useCredentials:
            format: checkbox
            title: Use credentials
            type: boolean
            options:
              order: 4
          username:
            minLength: 1
            title: Username
            type: string
            options:
              order: 5
              dependencies:
                useCredentials: true
          password:
            format: password
            minLength: 1
            title: Password
            type: string
            options:
              order: 6
              dependencies:
                useCredentials: true
        required:
          - endpoint
          - securityPolicy
          - securityMode
          - useCredentials
        title: OPC-UA Server Details
        type: object
    !u ACS.Driver.MQTT:
      polled: false
      presentation:
        address:
          title: "Topic"
          description: "The MQTT topic to subscribe to (e.g. device/+/data or factory/area1/#)"
          icon: "exchange-alt"
          placeholder: "e.g. /robot01/axis/1/position"
        path:
          title: "JSON Path"
          description: "JSONPath notation to extract specific values from the message payload (e.g. $.data.temperature)"
          icon: "code"
          placeholder: "e.g. $.value"
      internal:
        connType: MQTT
        details: MQTTConnDetails
      schema:
        properties:
          host:
            minLength: 1
            title: Hostname/IP
            type: string
            options:
              order: 1
          port:
            default: 1883
            minLength: 1
            title: Port
            type: number
            options:
              order: 2
          protocol:
            default: mqtt
            enum:
              - mqtt
              - mqtts
              - tcp
              - tls
              - ws
              - wss
            minLength: 1
            title: Protocol
            type: string
            options:
              order: 3
          clientId:
            title: Client ID
            type: string
            options:
              order: 4
              inputAttributes:
                placeholder: Leave blank for auto generation
          username:
            title: Username
            type: string
            options:
              order: 5
          password:
            format: password
            title: Password
            type: string
            options:
              order: 6
          cleanSession:
            default: true
            format: checkbox
            title: Clean Session
            type: boolean
            options:
              order: 7
          keepAlive:
            default: 60
            title: Keep Alive Interval (sec)
            type: number
            options:
              order: 8
          useSSL:
            format: checkbox
            title: Use SSL?
            type: boolean
            options:
              order: 9
        required:
          - host
          - port
          - protocol
        title: MQTT Server Details
        type: object
    !u ACS.Driver.UDP:
      polled: false
      presentation:
        address:
          title: "Port"
          description: "The UDP port to listen on (e.g. 50205)"
          icon: "network-wired"
          placeholder: "e.g. 50205"
        path:
          title: "Data Selector"
          description: "Selector to extract specific values from the UDP message (e.g. data[0] for first byte)"
          icon: "filter"
          placeholder: "e.g. data[0]"
      internal:
        connType: UDP
        details: UDPConnDetails
      schema:
        properties:
          port:
            enum:
              - 50205
            title: Port
            type: number
            options:
              order: 1
        title: UDP Server Details
        type: object
    !u ACS.Driver.Bacnet:
      polled: true
      presentation:
        address:
          title: "Device ID"
          description: "The Bacnet device identifier (numeric ID of the device)"
          icon: "building"
          placeholder: "e.g. 1234"
        path:
          title: "Object ID"
          description: "The Bacnet object identifier (format: object-type:instance-number, e.g. analog-value:1)"
          icon: "cube"
          placeholder: "e.g. analog-value:1"
      image:
        repository: edge-bacnet
      schema:
        properties:
          host:
            minLength: 1
            title: Hostname/IP
            type: string
            options:
              order: 1
        required:
          - host
        title: Bacnet Connection Details
        type: object
    !u ACS.Driver.Modbus:
      polled: true
      presentation:
        address:
          title: "Modbus Address"
          description: "Format: id,type,address,length (e.g. 1,holding,0,1) where id=device ID, type=register type (holding, input, coil, discrete), address=register address, length=number of registers"
          icon: "server"
          placeholder: "e.g. 1,holding,0,1"
        path:
          title: "Path"
          description: "Set this to 0"
          placeholder: "e.g. 0 (must be set to 0)"
      image:
        repository: edge-modbus
      schema:
        properties:
          host:
            minLength: 1
            title: Hostname/IP
            type: string
            options:
              order: 1
          port:
            default: 502
            title: Port
            type: number
            options:
              order: 2
          protocol:
            default: tcp
            enum:
              - tcp
            minLength: 1
            title: Protocol
            type: string
            options:
              order: 3
        required:
          - host
        title: Modbus Connection Details
        type: object
    !u ACS.Driver.Test:
      polled: true
      presentation:
        address:
          title: "Test Address"
          description: "Format: function:period:amplitude:packing (e.g. sin:3000:50:bd)"
          icon: "wave-square"
          placeholder: "e.g. sin:3000:50:bd"
        path:
          title: "Path"
          description: "Set this to 0"
          placeholder: "e.g. 0 (must be set to 0)"
      image:
        repository: edge-test
      schema:
        properties: null
        title: Test Connection Details
        type: object
    !u ACS.Driver.TPlinkSmartPlug:
      polled: true
      presentation:
        address:
          title: "Command"
          description: "The command to read from the smart plug (SysInfo, PowerState, InUse, or Meter)"
          icon: "plug"
          placeholder: "e.g. PowerState"
        path:
          hidden: true
      image:
        repository: edge-tplink-smartplug
      schema:
        properties:
          host:
            minLength: 1
            title: Hostname/IP
            type: string
            options:
              order: 1
          timeout:
            title: Connection Timeout (ms)
            type: number
            default: 5000
            options:
              order: 2
        required:
          - host
        title: TP-Link Smart Plug Details
        type: object
    !u ACS.Driver.ADS:
      image:
        repository: edge-ads
      polled: false
      presentation:
        address:
          description: "The TwinCAT symbol name with optional cycle time (format:
            symbol_name[,cycle_time_ms])"
          icon: microchip
          placeholder: e.g. Global_IO.iAnalogue,500
          title: Symbol Name
        path:
          description: Must be set to $
          icon: code
          placeholder: Must be set to $
          title: Path
      schema:
        properties:
          localAdsPort:
            description: Local ADS port (auto-assigned if not specified)
            options:
              order: 6
            title: Local ADS Port (Optional)
            type: number
          localAmsNetId:
            description: Local AMS NetId (auto-assigned if not specified)
            options:
              order: 5
            title: Local AMS NetId (Optional)
            type: string
          routerAddress:
            description: IP address of the ADS router (usually the PLC)
            minLength: 1
            options:
              order: 2
            title: Router Address
            type: string
          routerTcpPort:
            default: 48898
            description: TCP port of the ADS router
            options:
              order: 4
            title: Router TCP Port
            type: number
          targetAdsPort:
            default: 851
            description: ADS port of the target (851 for TwinCAT runtime)
            options:
              order: 3
            title: Target ADS Port
            type: number
          targetAmsNetId:
            description: AMS NetId of the target PLC (e.g. 172.16.48.37.1.1)
            minLength: 1
            options:
              order: 1
            title: Target AMS NetId
            type: string
          timeoutDelay:
            default: 5000
            description: Connection timeout in milliseconds
            options:
              order: 7
            title: Timeout Delay (ms)
            type: number
        required:
          - targetAmsNetId
          - routerAddress
        title: ADS Connection Details
        type: object

    !u ACS.Driver.RTDE:
      image:
        repository: edge-rtde
      polled: false
      presentation:
        address:
          description: "The Metric Address to subscribe to. Available addresses: json/state (complete robot state), json/jointData (joint positions/velocities/currents), json/cartesianInfo (TCP position/orientation), json/robotModeData (robot mode/speeds/emergency stop), json/toolData (tool I/O/voltage/current), json/masterboardData (master board I/O/safety mode), json/forceModeFrame (force mode data), json/additionalInfo (freedrive button status), json/toolCommunicationInfo (tool communication settings)"
          icon: "exchange-alt"
          placeholder: "e.g. json/jointData"
          title: "Metric Address"
        path:
          description: "JSONPath notation to extract specific values from the message payload. Examples: $[0].positionActual (joint 0 position), $.toolVectorX (TCP X position), $.robotMode (robot mode), $.toolVoltage48V (tool voltage), $.freedriveButtonPressed (freedrive button status)"
          icon: "code"
          placeholder: "e.g. $[0].positionActual"
          title: "JSON Path"
      schema:
        properties:
          host:
            minLength: 1
            options:
              order: 1
            title: "Hostname/IP"
            type: string
          port:
            default: 30001
            description: "RTDE interface port. Common ports: 30001 (RTDE configuration/setup), 30002 (Dashboard server), 30003 (Primary/Secondary interface), 30004 (RTDE data exchange - most common for real-time streaming)"
            minLength: 1
            options:
              order: 2
            title: "Port"
            type: number
        required:
          - host
          - port
        title: "RTDE Connection Details"
        type: object

    !u ACS.Driver.Pathfindr:
      image:
        repository: edge-pathfindr
      polled: true
      presentation:
        address:
          title: "Pathfindr Address"
          description: "What to read, as <data>/<serial>. Examples:
            location/SN12345, enviro/SN12345, runtime/SN12345,
            attrs/SN12345, buildings/55/cells. The driver's own interface
            builds these for you."
          icon: "location-dot"
          placeholder: "e.g. location/SN12345"
        path:
          title: "JSON Path"
          description: "JSONPath into the response, e.g.
            $.location.building or $.latest_temperature"
          icon: "code"
          placeholder: "e.g. $.location.building"
      # Rendered by the Manager in place of the per-metric fields. Generated
      # from edge-pathfindr/ui/metric-panel.html by
      # edge-pathfindr/tools/inline-ui.js; edit that file, not this one.
      # edge-pathfindr/test/ui-sync.test.js fails if the two diverge.
      ui:
        version: 1
        # BEGIN metric-panel.html
        document: |
          <!doctype html>
          <!-- ACS Pathfindr driver: per-metric configuration panel.
               Copyright 2026 University of Sheffield AMRC

               This document is embedded in the driver definition and rendered by the
               ACS Manager in a sandboxed frame. It has no network access by design
               (see acs-admin/.docker/nginx.conf), so it describes the Pathfindr API
               rather than a particular tenant: the operator reads their asset serial
               off the beacon or the portal and types it here.

               Keep this in sync with the copy in acs-service-setup/dumps/edge.yaml.
               test/ui-sync.test.js fails if they diverge. -->
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>Pathfindr metric</title>
          <style>
            :root {
              --bg: #f3f4f6; --surface: #fff; --text: #111827; --muted: #6b7280;
              --border: #d1d5db; --radius: 0.5rem;
              --font: ui-sans-serif, system-ui, sans-serif; --size: 14px;
            }
            * { box-sizing: border-box; }
            body {
              margin: 0; padding: 14px;
              background: var(--bg); color: var(--text);
              font-family: var(--font); font-size: var(--size);
            }
            .grid { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
            @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
            label { display: flex; flex-direction: column; gap: 4px; }
            .lbl { font-size: 12px; font-weight: 600; color: var(--muted); }
            select, input {
              font: inherit; color: inherit; background: var(--surface);
              border: 1px solid var(--border); border-radius: var(--radius);
              padding: 8px 10px; width: 100%;
            }
            select:focus-visible, input:focus-visible {
              outline: 2px solid var(--text); outline-offset: 1px;
            }
            .hint { font-size: 12px; color: var(--muted); margin-top: 2px; }
            .out {
              grid-column: 1 / -1;
              background: var(--surface); border: 1px solid var(--border);
              border-radius: var(--radius); padding: 10px 12px;
              display: grid; grid-template-columns: auto 1fr; gap: 3px 12px;
              font-size: 12px;
            }
            .out dt { color: var(--muted); }
            .out dd {
              margin: 0; font-family: ui-monospace, Menlo, Consolas, monospace;
              overflow-wrap: anywhere;
            }
            .warn { grid-column: 1 / -1; color: #b91c1c; font-size: 12px; }
            .hidden { display: none; }
          </style>
          </head>
          <body>

          <div class="grid">
            <label>
              <span class="lbl">Data</span>
              <select id="data"></select>
              <span class="hint" id="dataHint"></span>
            </label>

            <label id="identWrap">
              <span class="lbl" id="identLabel">Serial number</span>
              <input id="ident" autocomplete="off" placeholder="e.g. SN12345">
              <span class="hint" id="identHint">As printed on the beacon, or shown in the Pathfindr portal</span>
            </label>

            <label id="extraWrap" class="hidden">
              <span class="lbl" id="extraLabel">Attribute name</span>
              <input id="extra" autocomplete="off" placeholder="e.g. SAP Order Number">
              <span class="hint">Exactly as it appears in Pathfindr</span>
            </label>

            <dl class="out">
              <dt>Address</dt><dd id="oAddr">-</dd>
              <dt>Path</dt><dd id="oPath">-</dd>
              <dt>Type</dt><dd id="oType">-</dd>
              <dt>Unit</dt><dd id="oUnit">-</dd>
            </dl>

            <div class="warn hidden" id="warn"></div>
          </div>

          <script>
          (function () {
            "use strict";

            var ENVELOPE = "fpDriverUi", VERSION = 1;

            /* Preference lists, not fixed types: the metric schema decides which
               Sparkplug types are legal and we pick the first that is allowed. */
            var NUM  = ["Float", "Double", "Int32", "Int64"];
            var INT  = ["Int32", "Int64", "Float", "Double"];
            var STR  = ["String"];
            var BOOL = ["Boolean", "Int32", "String"];

            /* The Pathfindr API's shape. This is the same for every customer of the
               vendor, which is why it can live in the driver definition. */
            var CATALOGUE = [
              { id: "loc.zone",    group: "Location", label: "Zone",
                addr: function (s) { return "location/" + s },
                path: "$.location.location", types: STR,
                hint: "The zone the asset was last seen in." },
              { id: "loc.building", group: "Location", label: "Building",
                addr: function (s) { return "location/" + s },
                path: "$.location.building", types: STR,
                hint: "The building the asset was last seen in." },
              { id: "loc.desc",    group: "Location", label: "Location description",
                addr: function (s) { return "location/" + s },
                path: "$.location.description", types: STR,
                hint: "Pathfindr's description of the asset's last known location." },
              { id: "loc.conf",    group: "Location", label: "Location confidence",
                addr: function (s) { return "location/" + s },
                path: "$.confidence", types: INT, unit: "%", low: 0, high: 100,
                hint: "How confident Pathfindr is in the reported location, as a percentage." },
              { id: "loc.seen",    group: "Location", label: "Last seen",
                addr: function (s) { return "location/" + s },
                path: "$.lastseen", types: STR,
                hint: "When the asset was last detected." },
              { id: "loc.timeat",  group: "Location", label: "Time at location",
                addr: function (s) { return "location/" + s },
                path: "$.time_at_location_calc", types: STR,
                hint: "How long the asset has been at its current location." },
              { id: "loc.business", group: "Location", label: "Business",
                addr: function (s) { return "location/" + s },
                path: "$.location.businessname", types: STR,
                hint: "The business area the asset's location belongs to." },
              { id: "bcn.battery", group: "Condition", label: "Beacon battery",
                addr: function (s) { return "beacon/" + s },
                path: "$.battery", types: INT, unit: "%", low: 0, high: 100,
                hint: "The tag's current battery level, as a percentage." },
              { id: "bcn.beat",    group: "Condition", label: "Beacon last heartbeat",
                addr: function (s) { return "beacon/" + s },
                path: "$.last_heartbeat", types: STR,
                hint: "When the tag last reported in." },
              { id: "env.temp",    group: "Condition", label: "Temperature",
                addr: function (s) { return "enviro/" + s },
                path: "$.latest_temperature", types: NUM,
                unit: "°C", low: -20, high: 60,
                hint: "The most recent temperature reading from the tag's sensor." },
              { id: "env.hum",     group: "Condition", label: "Humidity",
                addr: function (s) { return "enviro/" + s },
                path: "$.latest_humidity", types: NUM, unit: "%", low: 0, high: 100,
                hint: "The most recent humidity reading from the tag's sensor." },
              { id: "env.at",      group: "Condition", label: "Reading taken at",
                addr: function (s) { return "enviro/" + s },
                path: "$.recorded_at", types: STR,
                hint: "When the tag last recorded temperature and humidity." },
              { id: "height.cm",   group: "Condition", label: "Height",
                addr: function (s) { return "height/" + s },
                path: "$", types: INT, unit: "cm", low: 0, high: 1000,
                hint: "The asset's last known height above the floor. UWB tags only." },
              { id: "impact.last", group: "Condition", label: "Latest impact",
                addr: function (s) { return "impacthistory/" + s },
                path: "$[0].impact", types: INT,
                hint: "The size of the most recent impact detected by the tag." },
              { id: "fluid.pct",   group: "Condition", label: "Fluid level",
                addr: function (s) { return "fluid/" + s },
                path: "$.reading_percent", types: NUM, unit: "%", low: 0, high: 100,
                hint: "The most recent fluid level reading, as a percentage." },

              { id: "act.mins",    group: "Runtime", label: "Activity duration",
                addr: function (s) { return "activity/" + s },
                path: "$.activity_duration_frame", types: INT, unit: "min", low: 0,
                hint: "How long the asset has been active, in minutes." },
              { id: "act.secs",    group: "Runtime", label: "Activity duration (seconds)",
                addr: function (s) { return "activity/" + s },
                path: "$.activity_duration_seconds_frame", types: INT, unit: "s", low: 0,
                hint: "How long the asset has been active, in seconds." },
              { id: "act.last",    group: "Runtime", label: "Last activity event",
                addr: function (s) { return "activity/" + s },
                path: "$.runtime_last_event", types: STR,
                hint: "When the asset was last active." },
              { id: "rt.total",    group: "Runtime", label: "Runtime hours (total)",
                addr: function (s) { return "runtime/" + s },
                path: "$.runtime_duration_total", types: STR,
                hint: "Total running time, as HH:MM:SS. GPS trackers only." },
              { id: "rt.batv",     group: "Runtime", label: "Tracker battery voltage",
                addr: function (s) { return "runtime/" + s },
                path: "$.battery_v", types: NUM, unit: "V", low: 0, high: 5,
                hint: "The GPS tracker's battery voltage. BLE tags report Beacon battery instead." },

              { id: "attr",        group: "Asset", label: "Custom attribute",
                addr: function (s) { return "attrs/" + s },
                path: null, types: STR, extra: "Attribute name",
                hint: "A site-defined field from the asset's record in Pathfindr." },
              { id: "asset.part",  group: "Asset", label: "Part number",
                addr: function (s) { return "assets/" + s },
                path: "$.partno", types: STR,
                hint: "The part number the asset was launched with." },
              { id: "asset.status", group: "Asset", label: "Status",
                addr: function (s) { return "assets/" + s },
                path: "$.status", types: STR,
                hint: "The asset's lifecycle status in Pathfindr." },
              { id: "bld.name",    group: "Site", label: "Building name",
                ident: "id", addr: function (s) { return "buildings/" + s },
                path: "$.name", types: STR,
                hint: "The building's name in Pathfindr." },
              { id: "bld.site",    group: "Site", label: "Building site",
                ident: "id", addr: function (s) { return "buildings/" + s },
                path: "$.site", types: STR,
                hint: "The site the building belongs to." },
              { id: "cell.zones",  group: "Site", label: "Zones in a cell",
                ident: "id", addr: function (s) { return "cells/" + s + "/zones" },
                path: "$", types: STR,
                hint: "Every zone in the cell, as JSON." }
            ];

            var el = function (id) { return document.getElementById(id) };
            var allowed = [];
            var initialised = false;

            function post (msg) {
              msg[ENVELOPE] = VERSION;
              parent.postMessage(msg, "*");
            }

            function report_height () {
              /* Measure the body, not documentElement. documentElement.scrollHeight
                 returns max(viewport, content), so once the embedder has sized the
                 frame to our reported height we would just measure that height back
                 and the panel could only ever grow. */
              var h = document.body ? document.body.getBoundingClientRect().height : 0;
              post({ type: "resize", height: Math.ceil(h) + 28 });
            }

            function build_options () {
              var sel = el("data"), groups = {};
              CATALOGUE.forEach(function (item) {
                if (!groups[item.group]) {
                  var g = document.createElement("optgroup");
                  g.label = item.group;
                  groups[item.group] = g;
                  sel.appendChild(g);
                }
                var o = document.createElement("option");
                o.value = item.id;
                o.textContent = item.label;
                groups[item.group].appendChild(o);
              });
            }

            function current () {
              var id = el("data").value;
              for (var i = 0; i < CATALOGUE.length; i++)
                if (CATALOGUE[i].id === id) return CATALOGUE[i];
              return CATALOGUE[0];
            }

            /* Choose the first preferred type the metric schema actually permits. */
            function pick_type (prefs) {
              if (!allowed.length) return prefs[0];
              for (var i = 0; i < prefs.length; i++)
                if (allowed.indexOf(prefs[i]) !== -1) return prefs[i];
              return null;
            }

            function apply_theme (theme) {
              if (!theme) return;
              var map = {
                background: "--bg", surface: "--surface", text: "--text",
                textMuted: "--muted", border: "--border", radius: "--radius",
                fontFamily: "--font", fontSize: "--size"
              };
              Object.keys(map).forEach(function (k) {
                if (theme[k]) document.documentElement.style.setProperty(map[k], theme[k]);
              });
            }

            function render () {
              var item = current();
              var wantsId = item.ident === "id";

              el("identLabel").textContent = wantsId ? "Pathfindr ID" : "Serial number";
              el("identHint").textContent = wantsId
                ? "The numeric id shown in the Pathfindr portal"
                : "As printed on the beacon, or shown in the Pathfindr portal";
              el("ident").placeholder = wantsId ? "e.g. 55" : "e.g. SN12345";
              el("dataHint").textContent = item.hint || "";
              el("extraWrap").className = item.extra ? "" : "hidden";
              if (item.extra) el("extraLabel").textContent = item.extra;

              var ident = el("ident").value.trim();
              var extra = el("extra").value.trim();
              var type  = pick_type(item.types);

              var problems = [];
              if (!ident) problems.push("Enter a " + (wantsId ? "Pathfindr ID" : "serial number") + ".");
              if (wantsId && ident && !/^[0-9]+$/.test(ident))
                problems.push("The Pathfindr ID must be a number.");
              if (!wantsId && /[\/?#&]/.test(ident))
                problems.push("A serial number cannot contain / ? # or &.");
              if (item.extra && !extra) problems.push("Enter the attribute name.");
              if (!type) problems.push("No suitable Sparkplug type is allowed for this metric.");

              var warn = el("warn");
              warn.textContent = problems.join(" ");
              warn.className = problems.length ? "warn" : "warn hidden";

              if (problems.length) {
                el("oAddr").textContent = "-";
                el("oPath").textContent = "-";
                el("oType").textContent = "-";
                el("oUnit").textContent = "-";
                report_height();
                return;
              }

              var address = item.addr(ident);
              /* JSONPath bracket form, so attribute names with spaces work. */
              var path = item.path !== null
                ? item.path
                : "$['" + extra.replace(/'/g, "\\'") + "']";

              el("oAddr").textContent = address;
              el("oPath").textContent = path;
              el("oType").textContent = type;
              el("oUnit").textContent = item.unit || "-";

              var values = {
                Address:        address,
                Path:           path,
                Sparkplug_Type: type,
                Eng_Unit:       item.unit || null
              };
              if (typeof item.low  === "number") values.Eng_Low  = item.low;
              if (typeof item.high === "number") values.Eng_High = item.high;

              post({ type: "propose", values: values });
              report_height();
            }

            /* Recover the panel's state from a metric that was configured earlier, so
               reopening it does not silently reset what the operator already set. */
            function restore (metric) {
              if (!metric || !metric.Address) return;
              var addr = String(metric.Address);
              var slash = addr.indexOf("/");
              if (slash < 0) return;

              var head = addr.slice(0, slash);
              var rest = addr.slice(slash + 1);
              var ident = rest.indexOf("/") >= 0 ? rest.slice(0, rest.indexOf("/")) : rest;

              for (var i = 0; i < CATALOGUE.length; i++) {
                var item = CATALOGUE[i];
                if (item.addr(ident) !== addr) continue;
                if (item.path !== null && item.path !== metric.Path) continue;
                el("data").value = item.id;
                el("ident").value = ident;
                if (item.path === null && metric.Path) {
                  var m = /^\$\['(.*)'\]$/.exec(String(metric.Path));
                  if (m) el("extra").value = m[1].replace(/\\'/g, "'");
                }
                return;
              }
            }

            window.addEventListener("message", function (event) {
              if (event.source !== parent) return;
              var d = event.data;
              if (!d || typeof d !== "object" || d[ENVELOPE] !== VERSION) return;
              if (d.type !== "init" || initialised) return;

              initialised = true;
              allowed = (d.constraints && d.constraints.allowed_types) || [];
              apply_theme(d.theme);
              restore(d.metric);
              render();
            });

            build_options();
            el("data").addEventListener("change", render);
            el("ident").addEventListener("input", render);
            el("extra").addEventListener("input", render);
            window.addEventListener("resize", report_height);

            /* Announce only once listeners are attached, so init cannot race us. */
            post({ type: "ready" });
          }());
          </script>
          </body>
          </html>
        # END metric-panel.html
      schema:
        properties:
          baseURL:
            description: "The Pathfindr host you log into, e.g.
              https://portal.pathfindr.co.uk. The vendor docs write this as
              [subdomain].pathfindr.co.uk, but there is no per-customer
              wildcard: it is the same host as your portal."
            minLength: 1
            options:
              order: 1
            title: "Base URL"
            type: string
          clientId:
            minLength: 1
            options:
              order: 2
            title: "Client ID"
            type: string
          clientSecret:
            format: password
            minLength: 1
            options:
              order: 3
            title: "Client Secret"
            type: string
          cacheMs:
            default: 60000
            description: "How long a collection sweep is reused, in
              milliseconds. Pathfindr allows 120 calls a minute across the
              whole tenant, so shortening this on a large estate risks
              exhausting the budget."
            options:
              order: 4
            title: "Cache Window (ms)"
            type: number
          rateLimit:
            default: 110
            description: "Maximum API calls per minute. Kept below the
              documented 120 so the driver throttles itself rather than
              being throttled."
            options:
              order: 5
            title: "Rate Limit (calls/min)"
            type: number
          maxPages:
            default: 20
            description: "Pages fetched per collection sweep, 100 assets a
              page. A sweep that hits this cap is logged; assets beyond it
              will not report."
            options:
              order: 6
            title: "Maximum Pages"
            type: number
          timeout:
            default: 15000
            options:
              order: 7
            title: "Request Timeout (ms)"
            type: number
          filterPartNo:
            description: "Optional. Restrict this connection to one part
              number, to keep a large estate inside the rate limit."
            options:
              order: 8
            title: "Filter by Part Number"
            type: string
          filterSerial:
            description: "Optional. Restrict this connection to one serial
              number."
            options:
              order: 9
            title: "Filter by Serial Number"
            type: string
        required:
          - baseURL
          - clientId
          - clientSecret
        title: "Pathfindr Connection Details"
        type: object

    !u ACS.Driver.External:
      polled: false
      presentation:
        address:
          title: "Address"
          description: "The address for the external driver (format depends on the specific external driver)"
          icon: "puzzle-piece"
          placeholder: "Enter address"
        path:
          title: "Path"
          description: "The path for the external driver (format depends on the specific external driver)"
          icon: "folder-tree"
          placeholder: "Enter path"
      external: true
---
service: !u UUIDs.Service.Authentication
version: 2
grants:
  !u ACS.Group.CentralMonitor:
    !u ACS.Role.EdgeNodeConsumer:
      !u ACS.Device.ConfigDB: false
    !u UUIDs.Permission.ConfigDB.ReadConfig:
      !u Edge.App.ClusterStatus: false
      !u UUIDs.App.SparkplugAddress: false
