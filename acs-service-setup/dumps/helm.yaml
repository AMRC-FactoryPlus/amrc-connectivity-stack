# Set up for the edge-sync Helm deployments
#-REQUIRE: auth edge sparkplug uns
---
service: !u UUIDs.Service.ConfigDB
version: 2
objects:
  !u ConfigDB.Class.R1Class:
    # In service-setup
    #!u Clusters.Class.HelmChart:
    #  name: "Helm chart"
    !u ACS.Class.EdgeDeployment:
      name: "Edge deployment"
    !u ACS.Class.Bridge:
      name: "UNS Bridge"
      subclassOf:
        - !u ACS.Class.EdgeDeployment

  !u ConfigDB.Class.R2Class:
    !u Clusters.Class.K8sResource:
      name: "K8s resource kind"

  !u UUIDs.Class.App:
    !u Clusters.App.K8sTemplate:
      name: "K8s resource template"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry
    !u Clusters.App.HelmTemplate:
      name: "Helm chart template"
      subclassOf:
        - !u MetaDB.Class.ConfigEntry

  !u Auth.Class.EdgeRole:
    !u Local.Role.EdgeAgent:
      name: "Active Edge Agent"
      memberOf:
        - !u Auth.Class.EdgeRole
        - !u Edge.Group.EdgeGroup
      subclassOf:
        - !u Auth.Class.EdgeAgent
        - !u ACS.Group.SparkplugNode
    !u Local.Role.EdgeMonitor:
      name: "Edge monitor"
      memberOf:
        - !u Auth.Class.EdgeRole
        - !u Edge.Group.EdgeGroup
      subclassOf:
        - !u Auth.Class.EdgeService
        - !u ACS.Group.SparkplugNode
        # XXX Until we can resolve the issues with dynamic MQTT ACLs,
        # just grant the Monitors the very big hammer of full
        # read/rebirth/reload rights. If we settled on SpGroup ==
        # Cluster we could reduce this to per-Group rights; this would
        # involve either a per-monitor explicit ACE or a new reflexive
        # UUID for group access.
        - !u ACS.Group.SparkplugReader
    !u Local.Role.EdgeSync:
      name: "Edge sync"
      memberOf:
        - !u Auth.Class.EdgeRole
        - !u Edge.Group.EdgeGroup
      subclassOf:
        - !u Auth.Class.EdgeService
    !u Local.Role.UNSBridge:
      name: "UNS Bridge"
      memberOf:
        - !u Auth.Class.EdgeRole
        - !u Edge.Group.EdgeGroup
      subclassOf:
        - !u Auth.Class.EdgeService
        - !u UNS.Group.Reader
    !u Local.Role.OPCUAServer:
      name: "OPC UA Server"
      memberOf:
        - !u Auth.Class.EdgeRole
        - !u Edge.Group.EdgeGroup
      subclassOf:
        - !u Auth.Class.EdgeService
        - !u UNS.Group.Reader

  !u Clusters.Class.SystemHelmChart:
    !u Local.Chart.EdgeAgent:
      name: "Edge Agent"
    !u Local.Chart.Cluster:
      name: "Edge cluster"
    !u Local.Chart.UNSBridge:
      name: "UNS Bridge"

  !u Clusters.Class.HelmChart:
    !u Local.Chart.ModbusRest:
      name: "Modbus-REST adapter"
    !u Local.Chart.MQTT:
      name: "Edge MQTT broker"
    !u Local.Chart.OPCUAServer:
      name: "OPC UA Server"
    !u Local.Chart.NTPServer:
      name: "NTP Server"

  !u Clusters.Class.K8sResource:
    !u Clusters.Resource.GitRepo:
      name: "GitRepository"
    !u Clusters.Resource.HelmRelease:
      name: "HelmRelease"

configs:
  !u UUIDs.App.ConfigSchema:
    !u Clusters.App.HelmTemplate:
      title: Helm chart template
      type: object
      required: [chart, values]
      additionalProperties: false
      properties:
        chart:
          description: Path to the Helm chart within the source repo.
          type: string
        prefix:
          description: Kubernetes-compatible prefix to add to the chart name. Must be specified if the chart name contains slashes.
          type: string
        source:
          description: Source to pull the Helm chart from.
          type: string
        values:
          description: >
            Helm values to apply. {{Templates}} will be expanded.
          type: object
    !u Clusters.App.K8sTemplate:
      title: K8s resource manifest template
      type: object
      required: [template, resources]
      additionalProperties: false
      properties:
        template:
          description: Resource template with {{templates}}
          type: object
          required: [apiVersion, kind]
        resources:
          description: Resource types which we replace
          type: array
          items:
            type: object
            required: [apiVersion, kind]
            additionalProperties: false
            properties:
              apiVersion: { type: string }
              kind: { type: string }

  !u Clusters.App.K8sTemplate:
    !u Clusters.Resource.GitRepo:
      resources:
        - apiVersion: source.toolkit.fluxcd.io/v1
          kind: GitRepository
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: GitRepository
        metadata: 
          name: "{{name}}"
          labels:
            "factoryplus.app.amrc.co.uk/uuid": "{{uuid}}"
        spec:
            interval: "3m"
            ref:
                branch: "main"
            secretRef:
                name: "flux-secrets"
            url: "{{url}}"
    !u Clusters.Resource.HelmRelease:
      resources:
        # We do NOT list old versions here. Kubernetes converts between
        # versions (or assumes identity conversions) so listing old
        # versions will cause problems. If the group or kind changes
        # then the old group/kind must be listed here so the old
        # resources are cleared out correctly.
        - apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
      template:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: "{{name}}"
          labels:
            "factoryplus.app.amrc.co.uk/uuid": "{{uuid}}"
        spec:
          chart:
            spec:
              chart: "{{chart}}"
              reconcileStrategy: Revision
              sourceRef:
                kind: GitRepository
                name: "{{source}}"
          install:
            crds: CreateReplace
          upgrade:
            crds: CreateReplace
          interval: 2m0s
          maxHistory: 1
          driftDetection:
            mode: enabled
          values: "{{values}}"

  !u Clusters.App.HelmTemplate:
    !u Local.Chart.Cluster:
      chart:  "edge-cluster"
      values:
        krb5: { realm: !acs "${realm}" }
        uuid:
          class:
            edgeAccount: !u Auth.Class.EdgeService
          group:
            edgeSync: !u Local.Role.EdgeSync
            edgeMonitor: !u Local.Role.EdgeMonitor
        cluster:
          name: "{{name}}"
          uuid: "{{uuid}}"
          domain: !acs "${domain}"
          directory: !acs "${directory}"
    !u Local.Chart.EdgeAgent:
      chart:  "edge-agent"
      values:
        name:   "{{name}}"
        uuid:   "{{uuid}}"
        hostname: "{{hostname}}"
        authGroup:
          edgeAgent: !u Local.Role.EdgeAgent
    !u Local.Chart.ModbusRest:
      chart:  "modbus-rest"
      values:
        name:   "{{name}}"
        uuid:   "{{uuid}}"
        hostname: "{{hostname}}"
    !u Local.Chart.MQTT:
      chart:  "mqtt-broker"
      values:
        name:   "{{name}}"
        uuid:   "{{uuid}}"
        hostname: "{{hostname}}"
    !u Local.Chart.UNSBridge:
      chart:  "uns-bridge"
      values:
        name:   "{{name}}"
        uuid:   "{{uuid}}"
        hostname: "{{hostname}}"
        authGroup:
          edgeService: !u Auth.Class.EdgeService
          unsReader: !u Local.Role.UNSBridge
    !u Local.Chart.OPCUAServer:
      chart:  "opcua-server"
      values:
        name:   "{{name}}"
        uuid:   "{{uuid}}"
        hostname: "{{hostname}}"
        authGroup:
          edgeService: !u Auth.Class.EdgeService
          unsReader: !u Local.Role.OPCUAServer
    !u Local.Chart.NTPServer:
      chart:  "ntp-server"
      values:
        name:   "{{name}}"
        uuid:   "{{uuid}}"
        hostname: "{{hostname}}"
---
service: !u UUIDs.Service.Authentication
version: 2
grants:
  !u Local.Role.EdgeAgent:
    !u ConfigDB.Perm.ReadConfig:
      !u Edge.App.AgentConfig: false
      # The agent proxies cassette fetches for the edge-sim driver
      # (drivers hold no credentials of their own).
      !u EdgeSim.App.Cassette: false
      # Edge Scout: the agent keeps each connection's scan status and
      # live values.
      !u Edge.App.ScoutStatus: false
      !u Edge.App.ScoutValues: false
    # ConfigDB checks WriteConfig against the app, not the object, so
    # any agent can write any connection's status and values entries.
    # An entry's node is written by the agent itself, so the Admin UI's
    # check that it hosts the connection is not a security boundary.
    !u ConfigDB.Perm.WriteConfig:
      !u Edge.App.ScoutStatus: false
      !u Edge.App.ScoutValues: false
    # Edge Scout: one File object per scan snapshot, which the agent
    # deletes when it drops out of a connection's current and previous.
    # The agent picks the snapshot's UUID, so ConfigDB checks
    # CreateSpecificObject. ConfigDB makes the agent the object's owner,
    # and every other snapshot grant is on Special.Mine, so an agent
    # can fill, read and delete only the snapshots it created. Today
    # the agent creates no other objects.
    !u ConfigDB.Perm.CreateSpecificObject:
      !u Edge.Class.ScoutResult: false
    !u ConfigDB.Perm.DeleteObject:
      !u UUIDs.Special.Mine: true
    !u Files.Perm.Upload:
      !u UUIDs.Special.Mine: true
    # The agent fetches files from the Files service for drivers' write
    # commands (edge-ftp), but only members of the delivery class. It
    # also reads back and deletes its own scan snapshots.
    !u Files.Perm.Download:
      !u Edge.Class.DeliveryFile: true
      !u UUIDs.Special.Mine: true
    !u Files.Perm.Delete:
      !u UUIDs.Special.Mine: true
  !u Local.Role.EdgeSync:
    !u ConfigDB.Perm.ReadConfig:
      !u Clusters.App.K8sTemplate: false
      !u Clusters.App.HelmTemplate: false
      !u Edge.App.Deployment: false
      !u Edge.App.ClusterStatus: false
    !u ConfigDB.Perm.WriteConfig:
      !u Edge.App.ClusterStatus: false
    !u ACS.Perm.Composite.EdgeNodeConsumer:
      !u ACS.Device.ConfigDB: false
  !u Local.Role.EdgeMonitor:
    !u ConfigDB.Perm.ReadConfig:
      !u Edge.App.AgentConfig: false
    !u ACS.Perm.Composite.EdgeNodeConsumer:
      !u ACS.Device.ConfigDB: false
    # XXX See above; this is very broad.
    !u Edge.Perm.ReloadConfig: null

