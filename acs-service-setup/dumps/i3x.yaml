# i3X northbound API service
# Needs: ConfigDB read (schemas, registration, ISA-95 vocabulary),
# Directory read (devices, links), UNS MQTT read (live values), Auth ACL
# read (incoming requests).
#
#-REQUIRE: auth directory sparkplug uns
---
service: !u UUIDs.Service.ConfigDB
version: 2
objects:
  !u Auth.Class.ServiceRole:
    !u I3X.Requirement.ServiceRole:
      name: "i3X API service"
      subclassOf:
        - !u Auth.Class.CentralService
        - !u UNS.Group.Reader

  !u UUIDs.Class.Service:
    !u I3X.Service.I3X: { name: "i3X REST API" }

  !u Auth.Class.ServicePerms:
    !u I3X.Perm.All:
      name: "i3X permission"
      subclassOf:
        - !u Auth.Class.Permission

  # ReadObject targets a device, a class of devices, or an ISA-95
  # vocabulary node. A grant on a node covers every device whose
  # hierarchy lies under it.
  !u I3X.Perm.All:
    !u I3X.Perm.ReadObject:
      name: "Read i3X objects"
---
service: !u UUIDs.Service.Authentication
version: 2
grants:
  !u I3X.Requirement.ServiceRole:
    # Advertise our service endpoint in the Directory
    !u Directory.Perm.AdvertiseService:
      !u I3X.Service.I3X: false

    # Read the ACLs of callers, for the i3X permissions only
    !u Auth.Perm.ReadACL:
      !u I3X.Perm.All: true

    # Read ConfigDB: object registration (class membership) and schemas
    !u ConfigDB.Perm.ReadConfig:
      !u UUIDs.App.Registration: false
      !u UUIDs.App.Schema: false
      !u UUIDs.App.Info: false
      # The ISA-95 vocabulary, to resolve grants on ISA-95 nodes.
      !u UUIDs.App.ISA95Vocabulary: false
      # Device originMap (Schema_UUID, Instance_UUID, ISA-95 hierarchy,
      # metric tree) — i3x reads this for every device in the Device
      # class to build the object tree.
      !u UUIDs.App.DeviceInformation: false

    # Read ConfigDB: list class members and subclasses
    !u ConfigDB.Perm.ReadMembers: null
    !u ConfigDB.Perm.ReadSubclasses: null

    # Read Directory: device links and relationships
    !u Directory.Perm.ReadDeviceLinks: null
    !u Directory.Perm.ReadLinkRelation: null
    !u Directory.Perm.ReadDeviceAlerts: null
