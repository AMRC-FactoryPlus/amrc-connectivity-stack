apiVersion: v2
version: 3.1.0
appVersion: "3.1.0"
name: amrc-connectivity-stack
icon: https://www.sheffield.ac.uk/themes/custom/uos/favicon.svg
description: The AMRC Connectivity Stack (ACS) is a collection of open-source services developed by the AMRC that enables an end-to-end implementation of the Factory+ framework.
home: factoryplus.app.amrc.co.uk
type: application
keywords:
  - factoryplus
  - sheffield
  - mqtt
  - sparkplug
  - iiot
maintainers:
  - name: Alex Godbehere
    email: alex.godbehere@amrc.co.uk
dependencies:
  - name: traefik
    version: 23.1.0
    repository: https://helm.traefik.io/traefik
    condition: traefik.enabled
  - name: grafana
    version: 6.52.4
    repository: https://grafana.github.io/helm-charts
    condition: grafana.enabled
  - name: influxdb2
    version: 2.1.1
    repository: https://helm.influxdata.com/
    condition: influxdb2.enabled
  - name: cert-manager
    repository: https://charts.jetstack.io
    version: v1.14.4
    condition: acs.letsEncrypt.enabled
  - name: openmetadata
    version: 2.0.6
    repository: https://helm.open-metadata.org/
    condition: openmetadata.enabled
  - name: openmetadata-dependencies
    version: 2.0.6
    repository: https://helm.open-metadata.org/
    condition: openmetadata-dependencies.enabled
  # SMB CSI driver for openmetadataSmb. Installed whenever
  # openmetadataSmb.enabled is true, unless csi-driver-smb.enabled is set
  # false because the cluster already has the driver.
  - name: csi-driver-smb
    version: 1.20.4
    repository: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-smb/master/charts
    condition: csi-driver-smb.enabled,openmetadataSmb.enabled
