{{- if .Values.briefcase.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: briefcase
  namespace: {{ .Release.Namespace }}
  labels:
    component: briefcase
spec:
  # Two exporters must never run at once, or both would build the same
  # briefcase.
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      component: briefcase
  template:
    metadata:
      labels:
        component: briefcase
    spec:
      {{- with .Values.acs.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: krb5-conf
          configMap:
            name: krb5-conf
        - name: keytabs
          secret:
            secretName: briefcase-keytabs

      initContainers:
{{ include "amrc-connectivity-stack.wait-for-kdc" . | indent 8 }}

      containers:
        - name: briefcase
{{ include "amrc-connectivity-stack.image" (list . .Values.briefcase) | indent 10 }}
          command: [ "/usr/bin/k5start", "-Uf", "/keytabs/client" ]
          args: [ "node", "bin/exporter.js" ]
          env:
            - name: VERBOSE
              value: {{ .Values.briefcase.verbosity | quote | required "values.briefcase.verbosity is required!" }}
            - name: KRB5_CONFIG
              value: /config/krb5-conf/krb5.conf
            - name: DIRECTORY_URL
              value: http://directory.{{ .Release.Namespace }}.svc.cluster.local
          volumeMounts:
            - mountPath: /config/krb5-conf
              name: krb5-conf
            - mountPath: /keytabs
              name: keytabs
{{- end }}
