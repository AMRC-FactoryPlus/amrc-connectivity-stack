{{ if .Values.gatewayDepot.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-depot
  namespace: {{ .Release.Namespace }}
  labels:
    component: gateway-depot
spec:
  # Onboarding is a conversation with a gateway which is held in memory,
  # so we must never run two.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      component: gateway-depot
  template:
    metadata:
      labels:
        component: gateway-depot
        factory-plus.service: gateway-depot
    spec:
      {{- with .Values.acs.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: krb5-conf
          configMap:
            name: krb5-conf
        - name: krb5-keytabs
          secret:
            secretName: gateway-depot-secrets
        {{- if .Values.gatewayDepot.stick.enabled }}
        - name: depot
          persistentVolumeClaim:
            claimName: gateway-depot-storage
        {{- end }}
        {{- with .Values.gatewayDepot.gateway.privateCASecret }}
        - name: gateway-ca
          secret:
            secretName: {{ . }}
        {{- end }}

      initContainers:
{{ include "amrc-connectivity-stack.wait-for-kdc" . | indent 8 }}

      containers:
        - name: webapi
{{ include "amrc-connectivity-stack.image" (list . .Values.gatewayDepot) | indent 10 }}
          command: ["/usr/bin/k5start", "-Uf", "/keytabs/client"]
          args: ["node", "bin/api.js"]
          env:
            - name: KRB5_CONFIG
              value: /config/krb5-conf/krb5.conf
            - name: CLIENT_KEYTAB
              value: /keytabs/client
            - name: SERVER_KEYTAB
              value: /keytabs/server
            # These two are used to verify Basic auth.
            - name: HOSTNAME
              value: gateway-depot.{{ .Release.Namespace }}.svc.cluster.local
            - name: REALM
              value: {{ .Values.identity.realm | required "values.identity.realm is required!" }}
{{ include "amrc-connectivity-stack.oidc-env" . | indent 12 }}
            - name: PORT
              value: "8080"
            - name: VERBOSE
              value: {{ .Values.gatewayDepot.verbosity | quote }}
{{ include "amrc-connectivity-stack.cache-max-age" (list . "gatewayDepot") | indent 12 }}
            - name: ROOT_PRINCIPAL
              value: admin@{{ .Values.identity.realm | required "values.identity.realm is required!" }}
            - name: DIRECTORY_URL
              value: http://directory.{{ .Release.Namespace }}.svc.cluster.local
            # The address gateways call us on. They call from wherever
            # they are imaged and from the shop floor, so it must be the
            # external address.
            - name: PUBLIC_URL
              value: {{ include "amrc-connectivity-stack.external-url" (list . "gateway-depot") | quote }}
            # Settings every gateway gets.
            - name: REGISTRY_MIRROR
              value: {{ .Values.gatewayDepot.gateway.registryMirror | quote }}
            - name: APT_MIRROR
              value: {{ .Values.gatewayDepot.gateway.aptMirror | quote }}
            - name: APT_MIRROR_KEY
              value: {{ .Values.gatewayDepot.gateway.aptMirrorKey | quote }}
            - name: APT_MIRROR_KEY_SHA256
              value: {{ .Values.gatewayDepot.gateway.aptMirrorKeySha256 | quote }}
            - name: APT_MIRROR_ORIGIN
              value: {{ .Values.gatewayDepot.gateway.aptMirrorOrigin | quote }}
            - name: ADMIN_USER
              value: {{ .Values.gatewayDepot.gateway.adminUser | quote }}
            - name: GATEWAY_LOCALE
              value: {{ .Values.gatewayDepot.gateway.locale | quote }}
            - name: GATEWAY_KEYBOARD
              value: {{ .Values.gatewayDepot.gateway.keyboard | quote }}
            - name: GATEWAY_TIMEZONE
              value: {{ .Values.gatewayDepot.gateway.timezone | quote }}
            - name: GATEWAY_CA
              value: {{ or .Values.gatewayDepot.gateway.privateCA (not (empty .Values.gatewayDepot.gateway.privateCASecret)) | quote }}
            {{- if .Values.gatewayDepot.gateway.privateCASecret }}
            - name: GATEWAY_CA_FILE
              value: /config/gateway-ca/ca.crt
            {{- end }}
            {{- if .Values.gatewayDepot.stick.enabled }}
            # The Job below builds the depot stick here.
            - name: STICK_DIR
              value: /depot/stick
            {{- end }}
          volumeMounts:
            - mountPath: /config/krb5-conf
              name: krb5-conf
            - mountPath: /keytabs
              name: krb5-keytabs
            {{- if .Values.gatewayDepot.stick.enabled }}
            - mountPath: /depot
              name: depot
              readOnly: true
            {{- end }}
            {{- if .Values.gatewayDepot.gateway.privateCASecret }}
            - mountPath: /config/gateway-ca
              name: gateway-ca
            {{- end }}

{{ include "amrc-connectivity-stack.service-probes" (list . 8080) | indent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-depot
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: "web"
      port: 80
      targetPort: 8080
  selector:
    factory-plus.service: gateway-depot
---
apiVersion: factoryplus.app.amrc.co.uk/v1
kind: KerberosKey
metadata:
  name: http.gateway-depot
  namespace: {{ .Release.Namespace }}
spec:
  type: Random
  secret: gateway-depot-secrets/server
  principal: HTTP/gateway-depot.{{ .Release.Namespace }}.svc.cluster.local@{{ .Values.identity.realm | required "values.identity.realm is required!" }}
  additionalPrincipals:
    - HTTP/gateway-depot.{{.Values.acs.baseUrl | required "values.acs.baseUrl is required"}}@{{ .Values.identity.realm | required "values.identity.realm is required!" }}
---
apiVersion: factoryplus.app.amrc.co.uk/v1
kind: KerberosKey
metadata:
  name: sv1gatewaydepot
  namespace: {{ .Release.Namespace }}
spec:
  type: Random
  secret: gateway-depot-secrets/client
  principal: sv1gatewaydepot@{{ .Values.identity.realm | required "values.identity.realm is required!" }}
  account:
    # Auth.Class.CentralService
    class: e463b4ae-a322-46cc-8976-4ba76838e908
    name: Gateway Depot
    groups:
      # GatewayDepot.Requirement.ServiceAccount
      - bf5b0af8-ecd7-40df-aa02-2441f9de9693
{{- if .Values.gatewayDepot.stick.enabled }}
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: gateway-depot-storage
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    component: gateway-depot
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.gatewayDepot.stick.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.gatewayDepot.stick.storage }}
---
# Builds the depot stick. The name changes with every release revision,
# so this runs on every install and upgrade. It does nothing when the
# stick on the volume is already built from the same inputs.
apiVersion: batch/v1
kind: Job
metadata:
  name: gateway-depot-stick-r{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    component: gateway-depot-stick
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        component: gateway-depot-stick
    spec:
      restartPolicy: OnFailure
      {{- with .Values.acs.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The volume attaches to one node, so run beside the service.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  component: gateway-depot
      securityContext:
        fsGroup: 1000
      volumes:
        - name: depot
          persistentVolumeClaim:
            claimName: gateway-depot-storage
        {{- with .Values.gatewayDepot.gateway.privateCASecret }}
        - name: gateway-ca
          secret:
            secretName: {{ . }}
        {{- end }}
      containers:
        - name: bake
{{ include "amrc-connectivity-stack.image" (list . .Values.gatewayDepot) | indent 10 }}
          command: ["/bin/bash", "stick/bake.sh"]
          env:
            - name: DEPOT_DIR
              value: /depot
            - name: PUBLIC_URL
              value: {{ include "amrc-connectivity-stack.external-url" (list . "gateway-depot") | quote }}
            {{- with .Values.gatewayDepot.stick.ubuntuIsoUrl }}
            - name: UBUNTU_ISO_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.gatewayDepot.gateway.privateCASecret }}
            - name: GATEWAY_CA_FILE
              value: /config/gateway-ca/ca.crt
            {{- end }}
          volumeMounts:
            - mountPath: /depot
              name: depot
            {{- if .Values.gatewayDepot.gateway.privateCASecret }}
            - mountPath: /config/gateway-ca
              name: gateway-ca
            {{- end }}
{{- end }}
{{- end -}}
