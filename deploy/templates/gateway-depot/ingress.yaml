{{ if .Values.gatewayDepot.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gateway-depot-ingressroute
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - {{ .Values.acs.secure | ternary "websecure" "web" }}
  routes:
    - match: Host(`gateway-depot.{{.Values.acs.baseUrl | required "values.acs.baseUrl is required"}}`)
      kind: Rule
      services:
        - name: gateway-depot
          port: 80
          namespace: {{ .Release.Namespace }}
  {{- if .Values.acs.secure }}
  tls:
    secretName: {{ coalesce .Values.gatewayDepot.tlsSecretName .Values.acs.tlsSecretName }}
    domains:
      - main: gateway-depot.{{.Values.acs.baseUrl | required "values.acs.baseUrl is required"}}
  {{- end -}}
{{- end -}}
