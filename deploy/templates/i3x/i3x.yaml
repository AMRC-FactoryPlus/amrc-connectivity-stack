{{- if .Values.i3x.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i3x
  namespace: {{ .Release.Namespace }}
  labels:
    component: i3x
spec:
  {{- if .Values.i3x.persistence.enabled }}
  # The database volume is ReadWriteOnce: stop the old pod before the
  # new one starts. With one replica, maxSurge 0 does what Recreate does.
  # Recreate itself cannot be used: switching an existing Deployment to
  # it fails under server-side apply (the Helm 4 default), because the
  # defaulted rollingUpdate block stays and the API server rejects
  # rollingUpdate with type Recreate.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  {{- end }}
  replicas: 1
  selector:
    matchLabels:
      component: i3x
  template:
    metadata:
      labels:
        component: i3x
        factory-plus.service: i3x
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      {{- with .Values.acs.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: krb5-conf
          configMap:
            name: krb5-conf
        - name: keytabs
          secret:
            secretName: i3x-keytabs
        - name: data
          {{- if .Values.i3x.persistence.enabled }}
          persistentVolumeClaim:
            claimName: i3x-data
          {{- else }}
          emptyDir: {}
          {{- end }}

      initContainers:
{{ include "amrc-connectivity-stack.wait-for-kdc" . | indent 8 }}

      containers:
        - name: i3x
{{ include "amrc-connectivity-stack.image" (list . .Values.i3x) | indent 10 }}
          command: [ "/usr/bin/k5start", "-Uf", "/keytabs/client" ]
          args: [ "node", "--es-module-specifier-resolution=node", "bin/api.js" ]
          {{- with .Values.i3x.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: KRB5_CONFIG
              value: /config/krb5-conf/krb5.conf
            - name: CLIENT_KEYTAB
              value: /keytabs/client
            - name: VERBOSE
              value: {{.Values.i3x.verbosity | quote | required "values.i3x.verbosity is required!"}}
            - name: SERVER_KEYTAB
              value: /keytabs/server
            - name: HOSTNAME
              value: i3x.{{ .Release.Namespace }}.svc.cluster.local
            - name: REALM
              value: {{ .Values.identity.realm | required "values.identity.realm is required!" }}
{{ include "amrc-connectivity-stack.oidc-env" . | indent 12 }}
            - name: SPARKPLUG_ADDRESS
              value: {{ .Values.acs.organisation | required "values.acs.organisation is required!" }}-Service-Core/i3X
            - name: DEVICE_UUID
              value: 16f85dd1-35f9-4bfc-9e08-4ce3b1e3b54e
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              value: {{ .Values.i3x.logLevel | default "info" | quote }}
            - name: DIRECTORY_URL
              value: http://directory.{{ .Release.Namespace }}.svc.cluster.local
            - name: INFLUX_URL
              value: http://acs-influxdb2.{{ .Release.Namespace }}.svc.cluster.local
            - name: INFLUX_ORG
              value: default
            - name: INFLUX_BUCKET
              value: default
            - name: INFLUX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: influxdb-auth
                  key: admin-token
            - name: I3X_NAMESPACE_NAME
              value: {{ .Values.acs.organisation | required "values.acs.organisation is required!" }}
            - name: I3X_NAMESPACE_URI
              value: {{ .Values.i3x.namespaceUri | default (printf "https://%s/i3x" .Values.acs.baseUrl) | quote }}
            - name: I3X_SUBSCRIPTION_TTL
              value: "300000"
            - name: I3X_STALE_THRESHOLD
              value: "300000"
            - name: I3X_DB_PATH
              value: /data/i3x.db
            - name: I3X_MCP_ENABLED
              value: {{ .Values.i3x.mcp.enabled | toString | quote }}
            {{- if and (not .Values.i3x.mcp.enabled) (gt (int .Values.i3x.maxHeapMB) 0) }}
            - name: NODE_OPTIONS
              value: "--max-old-space-size={{ int .Values.i3x.maxHeapMB }}"
            {{- end }}
          volumeMounts:
            - mountPath: /config/krb5-conf
              name: krb5-conf
            - mountPath: /keytabs
              name: keytabs
            - mountPath: /data
              name: data

{{ include "amrc-connectivity-stack.service-probes" (list . 8080) | indent 10 }}
---
{{- if .Values.i3x.persistence.enabled }}
# The i3X database: the object tree and last values. It is a cache of
# ConfigDB and the UNS, so losing it costs only a full sync.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: i3x-data
  namespace: {{ .Release.Namespace }}
  labels:
    component: i3x
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.i3x.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.i3x.persistence.size | required "values.i3x.persistence.size is required!" }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: i3x
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: "web"
      port: 80
      targetPort: 8080
  selector:
    factory-plus.service: i3x
{{- end -}}
