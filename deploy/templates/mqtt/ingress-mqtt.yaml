{{ if .Values.mqtt.enabled }}
{{- $sni := and .Values.acs.secure .Values.mqtt.matchHostSNI
    | ternary (printf "mqtt.%s" .Values.acs.baseUrl) "*" }}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: mqtt-ingressroute
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - {{ .Values.mqtt.entryPoint
        | default (.Values.acs.secure | ternary "mqttsecure" "mqtt") }}
  routes:
    - match: HostSNI(`{{ $sni }}`)
      services:
        - name: mqtt
          port: 1883
          namespace: {{ .Release.Namespace }}
  {{- if .Values.acs.secure }}
  tls:
    secretName: {{ coalesce .Values.mqtt.tlsSecretName .Values.acs.tlsSecretName }}
    domains:
      - main: mqtt.{{.Values.acs.baseUrl | required "values.acs.baseUrl is required"}}
  {{ end }}
{{- end -}}
