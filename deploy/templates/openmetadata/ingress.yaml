{{ if .Values.openmetadata.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openmetadata-ingressroute
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - {{ .Values.acs.secure | ternary "websecure" "web" }}
  routes:
    - match: Host(`openmetadata.{{.Values.acs.baseUrl | required "values.acs.baseUrl is required"}}`)
      kind: Rule
      services:
        - name: openmetadata
          port: 8585
          namespace: {{ .Release.Namespace }}
  {{- if .Values.acs.secure }}
  tls:
    secretName: {{ coalesce .Values.openmetadata.tlsSecretName .Values.acs.tlsSecretName }}
    domains:
      - main: openmetadata.{{.Values.acs.baseUrl | required "values.acs.baseUrl is required"}}
  {{- end -}}
{{- end -}}