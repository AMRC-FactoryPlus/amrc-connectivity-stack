{{ if .Values.openmetadata.enabled }}
{{- if not (lookup "v1" "Secret" .Release.Namespace "openmetadata-mysql-secrets") }}

apiVersion: v1
kind: Secret
metadata:
  name: "openmetadata-mysql-secrets"
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
data:
  # Key names are fixed by the bitnami mysql chart's auth.existingSecret contract.
  mysql-root-password: {{ randAlphaNum 32 | b64enc | quote }}
  mysql-replication-password: {{ randAlphaNum 32 | b64enc | quote }}
  mysql-password: {{ randAlphaNum 32 | b64enc | quote }}

{{- end }}
---
{{- /*
  airflow-mysql-password needs to end up in two places that must always
  agree: the password the mysql initdb script actually sets for
  airflow_user (via airflow-mysql-secrets, read by mysql.primary.extraEnvVars),
  and the connection string the apache/airflow chart uses to reach that
  same user (data.metadataSecretName below - the chart has no per-field
  secretRef for just the password, only a full pre-built connection
  string). So this value is computed once here and reused for both,
  instead of two independent randAlphaNum calls that would drift apart.
  Read back the existing value across upgrades rather than the usual
  "skip the whole block if lookup finds it" pattern, since the second
  secret needs the value even when the first secret already exists.
*/}}
{{- $airflowMysqlSecret := lookup "v1" "Secret" .Release.Namespace "airflow-mysql-secrets" }}
{{- $airflowMysqlPassword := randAlphaNum 32 }}
{{- if $airflowMysqlSecret }}
{{- $airflowMysqlPassword = index $airflowMysqlSecret.data "airflow-mysql-password" | b64dec }}
{{- end }}
{{- if not $airflowMysqlSecret }}

apiVersion: v1
kind: Secret
metadata:
  name: "airflow-mysql-secrets"
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
data:
  airflow-mysql-password: {{ $airflowMysqlPassword | b64enc | quote }}

{{- end }}
---
{{- if not (lookup "v1" "Secret" .Release.Namespace "airflow-metadata-db") }}

apiVersion: v1
kind: Secret
metadata:
  name: "airflow-metadata-db"
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
data:
  # Key name and format ("connection" holding a full SQLAlchemy URI) are
  # fixed by the apache/airflow chart's data.metadataSecretName contract.
  connection: {{ printf "mysql://airflow_user:%s@mysql:3306/airflow_db" $airflowMysqlPassword | b64enc | quote }}

{{- end }}
---
{{- if not (lookup "v1" "Secret" .Release.Namespace "airflow-secrets") }}

apiVersion: v1
kind: Secret
metadata:
  name: "airflow-secrets"
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
data:
  openmetadata-airflow-password: {{ randAlphaNum 32 | b64enc | quote }}

{{- end }}
---
{{- if not (lookup "v1" "Secret" .Release.Namespace "elasticsearch-secrets") }}

apiVersion: v1
kind: Secret
metadata:
  name: "elasticsearch-secrets"
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
data:
  # OpenSearch's admin password policy requires upper/lower/digit/symbol.
  # Sprig has no combined alphanum+symbols random function, so build one
  # from randAlpha/randNumeric and append a fixed symbol to guarantee it.
  openmetadata-elasticsearch-password: {{ printf "%s%s!" (randAlpha 24) (randNumeric 7) | b64enc | quote }}

{{- end }}
{{- end -}}
