{{- /*
  The SMB login for openmetadataSmb, as a SealedSecret. The values are
  encrypted with kubeseal against this cluster's sealed-secrets
  controller, so they're safe to keep in a values file; the controller
  decrypts them into credentialsSecret. Each value must be sealed for
  that Secret's name and the release namespace. Without
  sealedCredentials the Secret is created by hand instead. See
  acs-openmetadata/smb-connection.md.
*/}}
{{- $smb := .Values.openmetadataSmb }}
{{- if and .Values.openmetadata.enabled $smb.enabled $smb.sealedCredentials }}
{{- $creds := $smb.sealedCredentials }}
{{- $_ := required "openmetadataSmb.sealedCredentials.username is required" $creds.username }}
{{- $_ := required "openmetadataSmb.sealedCredentials.password is required" $creds.password }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $smb.credentialsSecret }}
  namespace: {{ .Release.Namespace }}
spec:
  encryptedData:
    {{- range $key, $value := $creds }}
    {{- if $value }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- end }}
  template:
    metadata:
      name: {{ $smb.credentialsSecret }}
      namespace: {{ .Release.Namespace }}
    type: Opaque
{{- end }}
