{{- if .Values.userAdmin.enabled }}
apiVersion: factoryplus.app.amrc.co.uk/v1
kind: KerberosKey
metadata:
  name: op1useradmin
  namespace: {{ .Release.Namespace }}
spec:
  type: Random
  principal: op1useradmin@{{ .Values.identity.realm | required "values.identity.realm is required!" }}
  secret: user-admin-keytabs/client
  account:
    class: e463b4ae-a322-46cc-8976-4ba76838e908
    name: User Admin
---
apiVersion: factoryplus.app.amrc.co.uk/v1
kind: KerberosKey
metadata:
  name: http.user-admin
  namespace: {{ .Release.Namespace }}
spec:
  type: Random
  principal: HTTP/user-admin.{{ .Release.Namespace }}.svc.cluster.local@{{ .Values.identity.realm | required "values.identity.realm is required!" }}
  secret: user-admin-keytabs/server
{{- end }}
