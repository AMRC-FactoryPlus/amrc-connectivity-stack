{{- if .Values.userAdmin.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-admin
  namespace: {{ .Release.Namespace }}
  labels:
    component: user-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      component: user-admin
  template:
    metadata:
      labels:
        component: user-admin
        factory-plus.service: user-admin
    spec:
      {{- with .Values.acs.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: krb5-conf
          configMap:
            name: krb5-conf
        - name: keytabs
          secret:
            secretName: user-admin-keytabs
        - name: krb5-ccache
          emptyDir:

      initContainers:
{{ include "amrc-connectivity-stack.wait-for-kdc" . | indent 8 }}

      containers:
        - name: user-admin
{{ include "amrc-connectivity-stack.image" (list . .Values.userAdmin) | indent 10 }}
          # A single worker: Bearer tokens live in FplusHttpAuth's
          # in-memory dict (lib/auth.py), not a shared store, so a
          # second worker process wouldn't recognise tokens minted by
          # the first. Threads, not more workers, give it concurrency.
          command: ["gunicorn", "--bind", "0.0.0.0:8080", "--workers", "1",
              "--threads", "4", "amrc.factoryplus.user_admin.app:create_app()"]
          {{- with .Values.userAdmin.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: KRB5_CONFIG
              value: /config/krb5-conf/krb5.conf
            # Outbound Factory+ calls (ConfigDB/Auth, as op1useradmin)
            # use the TGT the tgt-creds sidecar keeps fresh.
            - name: KRB5CCNAME
              value: /ccache/krbkeys
            # Kadm.create_princ needs a kadmin/admin service ticket,
            # distinct from the plain TGT above - the kadmin-creds
            # sidecar keeps this one fresh.
            - name: KADMIN_CCNAME
              value: /ccache/kadmin
            # Inbound SPNEGO (lib/auth.py's gssapi.SecurityContext)
            # reads its acceptor keytab from this standard env var.
            - name: KRB5_KTNAME
              value: /keytabs/server
            # Inbound Basic auth needs the realm to qualify a bare
            # username (e.g. "admin") into a full principal.
            - name: REALM
              value: {{ .Values.identity.realm | required "values.identity.realm is required!" }}
            - name: DIRECTORY_URL
              value: http://directory.{{ .Release.Namespace }}.svc.cluster.local
          volumeMounts:
            - mountPath: /config/krb5-conf
              name: krb5-conf
            - mountPath: /keytabs
              name: keytabs
            - mountPath: /ccache
              name: krb5-ccache
{{ include "amrc-connectivity-stack.service-probes" (list . 8080) | indent 10 }}

        - name: tgt-creds
{{ include "amrc-connectivity-stack.image" (list . .Values.userAdmin) | indent 10 }}
          command: ["/usr/bin/k5start", "-Uf", "/keytabs/client", "-K", "5"]
          args: []
          env:
            - name: KRB5_CONFIG
              value: /config/krb5-conf/krb5.conf
            - name: KRB5CCNAME
              value: /ccache/krbkeys
          volumeMounts:
            - mountPath: /config/krb5-conf
              name: krb5-conf
            - mountPath: /keytabs
              name: keytabs
            - mountPath: /ccache
              name: krb5-ccache

        - name: kadmin-creds
{{ include "amrc-connectivity-stack.image" (list . .Values.userAdmin) | indent 10 }}
          command: [
            "/usr/bin/k5start", "-K", "5",
            "-Uf", "/keytabs/client",
            "-S", "kadmin", "-I", "admin" ]
          args: []
          env:
            - name: KRB5_CONFIG
              value: /config/krb5-conf/krb5.conf
            - name: KRB5CCNAME
              value: /ccache/kadmin
          volumeMounts:
            - mountPath: /config/krb5-conf
              name: krb5-conf
            - mountPath: /keytabs
              name: keytabs
            - mountPath: /ccache
              name: krb5-ccache
---
apiVersion: v1
kind: Service
metadata:
  name: user-admin
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    factory-plus.service: user-admin
{{- end -}}
