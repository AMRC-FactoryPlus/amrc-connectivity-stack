[package]
name = "edge-focas"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "driver"
path = "src/main.rs"

[dependencies]
rs-edge-driver = { path = "../lib/rs-edge-driver" }
async-trait = "0.1"
bytes = "1"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
# The driver-loop test borrows the fake Edge Agent from the library's
# own tests, which needs these.
rumqttc = { version = "0.25.1", default-features = false }
tokio = { version = "1", features = ["full"] }

[profile.release]
strip = true
