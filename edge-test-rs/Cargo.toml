[package]
name = "edge-test-rs"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "driver"
path = "src/main.rs"

[dependencies]
rs-edge-driver = { path = "../lib/rs-edge-driver" }
async-trait = "0.1"
bytes = "1"
# libm is a port of the same fdlibm code V8 uses for Math.sin, so the
# sine wave matches the JS driver bit for bit. std's sin calls the
# platform's libm, which can differ in the last bit.
libm = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"

[dev-dependencies]
# The driver-loop test borrows the fake Edge Agent from the library's
# own tests, which needs these.
rumqttc = { version = "0.25.1", default-features = false }
tokio = { version = "1", features = ["full"] }
# Checks scan output against lib/edge-scout-schemas. The schemas are
# read from disk, so no HTTP resolver.
jsonschema = { version = "0.33", default-features = false }

[profile.release]
strip = true
