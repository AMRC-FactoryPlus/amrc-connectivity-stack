[project]
name = "amrc.factoryplus.service_client"
version = "0.1.0"
description = "Factory+ service client library for Python."
authors = [{ name = "AMRC", email = "info@amrc.co.uk" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests (>=2.32.0,<3.0.0)",
    "requests-cache (>=1.2.0,<2.0.0)",
    "requests-kerberos (>=0.15.0,<1.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "amrc", from = "src" }
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-mock = "^3.14.0"
