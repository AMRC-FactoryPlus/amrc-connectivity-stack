[package]
name = "rs-edge-driver"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 0.25 is the first release that can set TCP_NODELAY. The link to the
# edge agent is plain TCP, so no TLS backend is built.
rumqttc = { version = "0.25.1", default-features = false }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
# CancellationToken, for stopping a scan (see src/scout.rs).
tokio-util = "0.7"
url = "2"

[dev-dependencies]
# Checks scouting messages against lib/edge-scout-schemas in the tests.
# The schemas are read from disk, so no HTTP resolver.
jsonschema = { version = "0.33", default-features = false }


[[example]]
name = "test_driver"
path = "examples/test_driver.rs"

[[example]]
name = "rate_stub"
path = "examples/rate_stub.rs"
